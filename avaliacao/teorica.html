<script>
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2800); }
function dmy(s){ var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3]+'/'+m[2]+'/'+m[1] : ''; }
function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function call(fn, args, ms){
  return new Promise(function(ok, ko){
    var done = false, tm = setTimeout(function(){ if (!done){ done = true; ko(new Error('TIMEOUT')); } }, ms || 40000);
    var r = google.script.run.withSuccessHandler(function(v){ if (!done){ done = true; clearTimeout(tm); ok(v); } })
      .withFailureHandler(function(e){ if (!done){ done = true; clearTimeout(tm); ko(new Error(e && e.message ? e.message : String(e))); } });
    r[fn].apply(r, args || []);
  });
}
function isNet(m){ return /TIMEOUT|NetworkError|HTTP 0|Failed to fetch|network|Load failed/i.test(String(m||'')); }
var ERR = { 'LA:SESSION':'A sessão expirou. Entre de novo.', 'LA:AREA':'Esta área não está entre as suas.', 'LA:NOACTIVITY':'Actividade não encontrada no Training Hub.',
  'LA:FUTURE':'Data futura: só é possível registar a partir do dia da actividade.', 'LA:MAX':'Nota máxima inválida.', 'LA:EMPTY':'Introduza pelo menos uma nota.',
  'LA:PERSON':'Pessoa desconhecida no Training Hub.', 'LA:SCORE':'Nota fora do intervalo para', 'LA:BUSY':'Sistema ocupado: tente de novo.', 'LA:DATA':'Pedido inválido.',
  'LA:TICKET':'Ligação inválida: abra de novo a partir da Agenda.', 'LA:EXPIRED':'Ligação expirada: abra de novo a partir da Agenda.', 'LA:USED':'Ligação já usada.', 'LA:NOLINK':'Learning & Assessment ainda não ligado à Agenda.' };
function errTxt(m){ m = String(m||''); var k = (m.match(/LA:[A-Z]+/) || [''])[0]; var x = m.split('|')[1]; return ERR[k] ? ERR[k] + (x ? ' ' + x : '') : (isNet(m) ? 'Sem ligação ao servidor. Tente de novo.' : m); }
/* autenticação: sessão da Agenda ou nome + PIN (TOJ / Painel) */
function authNow(){ var s = laSess(); if (s && s.sess) return { sess: s.sess, name: s.name }; return store('chdcp_toj_v2_auth') || store('rs_auth') || null; }

var AUTH = null, CTX = null, D = null, OUTK = 'la_theory_outbox';
function head(t, s){ $('tt').textContent = t; $('ts').textContent = s || 'Learning & Assessment'; }
function num(v){ var s = String(v == null ? '' : v).trim().replace(',', '.'); if (s === '') return null; var n = Number(s); return isNaN(n) ? null : n; }
function uid(){ return 'TH-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function outbox(){ return store(OUTK) || []; }
function flush(){
  var o = outbox(); if (!o.length || !AUTH) return;
  var it = o[0];
  call('laSaveTheory', [AUTH, it.p], 60000).then(function(){ store(OUTK, outbox().filter(function(x){ return x.p.clientId !== it.p.clientId; })); toast('Enviado: ' + it.l); flush(); })
    .catch(function(e){ if (!isNet(e.message)) { store(OUTK, outbox().filter(function(x){ return x.p.clientId !== it.p.clientId; })); toast('Não enviado (' + it.l + '): ' + errTxt(e.message)); } });
}
window.addEventListener('online', function(){ setTimeout(flush, 1500); });
$('bk').onclick = function(){ if (CTX && !LA.p.activityId) { CTX = null; $('bar').innerHTML = ''; pick(); } else laBack(); };
$('hmw').innerHTML = laHomeBtn('color:#fff;border-color:rgba(255,255,255,.55)');
var SAVED_MSG = '';

function pick(){
  head('Avaliação teórica', 'Escolha a actividade');
  $('app').innerHTML = '<div class="load">A carregar…</div>';
  call('laTheoryActivities', [AUTH]).then(function(list){
    var h = outbox().length ? '<div class="banner warn">' + outbox().length + ' registo(s) por enviar<button id="fl">Enviar agora</button></div>' : '';
    h += list.length ? list.map(function(a){ return '<button class="hrow' + (a.test ? ' test' : '') + '" data-id="' + esc(a.id) + '"><div class="t">' + (a.test ? '📝 ' : '') + esc(a.t) + '</div><div class="m">' + esc(dmy(a.d)) + ' · ' + esc(a.area) + ' · ' + esc(a.id) + '</div></button>'; }).join('')
      : '<div class="card note">Sem actividades nos últimos dias nas suas áreas.</div>';
    $('app').innerHTML = h;
    if ($('fl')) $('fl').onclick = flush;
    Array.prototype.forEach.call(document.querySelectorAll('.hrow'), function(b){ b.onclick = function(){ load(b.getAttribute('data-id'), null); }; });
  }).catch(fail);
}
function fail(e){ var m = errTxt(e.message); if (/sessão/.test(m)) { laNav('home'); return; } $('app').innerHTML = '<div class="card"><div class="err">' + esc(m) + '</div><button class="btn" id="rt">Tentar de novo</button></div>'; $('rt').onclick = start; }
function load(id, fb){
  $('app').innerHTML = '<div class="load">A carregar…</div>';
  call('laTheoryContext', [AUTH, id, fb]).then(function(c){
    CTX = c; D = { raw: {}, max: c.max, assessment: c.assessment, cid: uid(), fb: fb };
    Object.keys(c.saved || {}).forEach(function(pid){ D.raw[pid] = c.saved[pid].raw; });
    draw();
  }).catch(fail);
}
function draw(){
  var c = CTX, a = c.act;
  head('Avaliação teórica', a.area + ' · ' + dmy(a.date));
  var h = '<div class="ctx"><b>' + esc(a.title) + '</b><br>' + esc(dmy(a.date)) + ' · ' + esc(a.area) + ' · ' + esc(a.id) + (a.provisional ? ' · <i>ainda não no Hub</i>' : '') + '<br>Avaliador: ' + esc(c.assessor) + '</div>';
  if (SAVED_MSG) h += '<div class="card" style="text-align:center;border-color:#b9dfc6"><div style="font-size:34px">✅</div><b>' + esc(SAVED_MSG) + '</b>' +
    '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn sec" id="nbBack" style="flex:1;margin:0">‹ ' + (laCanBack() ? 'Voltar à actividade' : 'Voltar') + '</button>' +
    '<button class="btn sec" id="nbHome" style="flex:1;margin:0" data-lanav="home">⌂ Início</button></div></div>';
  else if (Object.keys(c.saved || {}).length) h += '<div class="banner ok">Notas já registadas: pode corrigir e guardar de novo.</div>';
  h += '<div class="two"><div><label class="field">Prova</label><input class="inp" id="tas" value="' + esc(D.assessment) + '"></div><div><label class="field">Nota máxima</label><input class="inp" id="tmx" inputmode="decimal" value="' + esc(D.max) + '"></div></div>' +
    '<p class="note" style="margin:8px 2px 10px">Aprovado com ≥ ' + esc(c.passMark) + '% (regra do Training Hub). Deixe vazio quem não fez a prova. Toque no nome para ver o perfil.</p>';
  h += '<div class="plist">' + (c.people.length ? c.people.map(function(p){
    var sub = [p.cohort, p.att === 'PRESENT' ? 'presente' : (p.att === 'ABSENT' ? 'ausente' : '')].filter(Boolean).join(' · ');
    return '<div class="prow"><div class="nm"><a href="#" data-lanav="person:' + esc(p.id) + '">' + esc(p.name) + '</a><span>' + esc(sub) + '</span></div>' +
      '<input class="score" data-p="' + esc(p.id) + '" inputmode="decimal" placeholder="—" value="' + esc(D.raw[p.id] == null ? '' : D.raw[p.id]) + '"><span class="pct" id="pc_' + esc(p.id) + '"></span></div>';
  }).join('') : '<div class="card note">Sem formandos da área ' + esc(a.area) + '.</div>') + '</div>';
  $('app').innerHTML = h;
  if ($('nbBack')) $('nbBack').onclick = function(){ if (!LA.p.activityId) { CTX = null; SAVED_MSG = ''; $('bar').innerHTML = ''; pick(); } else laBack(); };
  SAVED_MSG = '';
  $('bar').innerHTML = '<div class="savebar"><button class="btn" id="save">Guardar notas</button></div>';
  var paint = function(){
    var max = num(D.max), n = 0, bad = false;
    c.people.forEach(function(p){
      var el = $('pc_' + p.id), v = num(D.raw[p.id]); if (!el) return;
      if (v == null) { el.textContent = ''; el.className = 'pct'; return; }
      n++;
      if (!max || v < 0 || v > max) { el.textContent = '!'; el.className = 'pct ko'; bad = true; return; }
      var pc = Math.round(v / max * 1000) / 10; el.textContent = pc + '%'; el.className = 'pct ' + (pc >= c.passMark ? 'ok' : 'ko');
    });
    $('save').disabled = !n || bad || !max; $('save').textContent = bad ? 'Nota fora de 0–' + (max || '?') : 'Guardar notas (' + n + ')';
  };
  Array.prototype.forEach.call(document.querySelectorAll('.score'), function(el){ el.oninput = function(){ D.raw[el.getAttribute('data-p')] = el.value; paint(); }; });
  $('tmx').oninput = function(){ D.max = this.value; paint(); };
  $('tas').oninput = function(){ D.assessment = this.value; };
  $('save').onclick = function(){
    var items = Object.keys(D.raw).filter(function(k){ return num(D.raw[k]) != null; }).map(function(k){ return { pid: k, raw: num(D.raw[k]) }; });
    var p = { clientId: D.cid, activityId: c.act.id, max: num(D.max), assessment: D.assessment, items: items, fallback: D.fb };
    $('save').disabled = true;
    call('laSaveTheory', [AUTH, p], 60000).then(function(r){
      SAVED_MSG = r.duplicate ? 'Já estava guardado.' : 'Notas guardadas: ' + r.passed + ' de ' + r.total + ' aprovados.';
      toast(SAVED_MSG); window.scrollTo(0, 0);
      D.cid = uid(); load(c.act.id, D.fb);
    }).catch(function(e){
      if (isNet(e.message)) { var o = outbox(); o.push({ p: p, l: c.act.title }); store(OUTK, o); toast('Sem ligação: guardado no telefone, será enviado.'); D.cid = uid(); $('save').disabled = false; return; }
      $('save').disabled = false; toast(errTxt(e.message));
    });
  };
  paint();
}
function start(){
  AUTH = authNow();
  if (!AUTH) { laNav('home'); return; }
  flush();
  if (LA.p && LA.p.activityId) load(LA.p.activityId, { area: LA.p.area, date: LA.p.date, title: LA.p.title });
  else pick();
}
laReady(start);
</script></body></html>
