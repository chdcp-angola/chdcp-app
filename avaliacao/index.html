<script>var LA_BOOT=(function(){var q=new URLSearchParams(location.search),p={};["mode","activityId","personId","area","date","title","tab"].forEach(function(k){p[k]=q.get(k)||"";});if(!p.mode)p.mode="";return{v:"36",t:q.get("t")||"",p:p,urls:{home:"index.html"}};})();</script><script>var LA = window.LA_BOOT || { p:{}, urls:{} };

/* mode: home | toj | theory | results | person | area — sessione già nel telefono, niente biglietto */
function laNav(mode, params){
  var q = laQs(Object.assign({ mode: mode === 'home' ? '' : mode }, params||{}));
  var url;
  if (window.CHDCP_PWA) {
    var pg = { home:'index.html', toj:'toj.html', theory:'teorica.html', results:'resultados.html', person:'resultados.html', area:'resultados.html' }[mode] || 'index.html';
    location.href = pg + (q ? '?' + q : ''); return;
  }
  url = (LA.urls && LA.urls.home) + (q ? '?' + q : '');
  try { window.open(url, '_top'); } catch(e){ location.href = url; }
}
/* biglietto dell'Agenda → sessione (una volta), poi parte la pagina */
function laReady(cb){
  if (!LA.t) { cb(laSess()); return; }
  var t = LA.t; LA.t = '';
  try { history.replaceState(null, '', location.pathname + location.search.replace(/([?&])t=[^&]*&?/, '$1').replace(/[?&]$/, '')); } catch(e){}
  google.script.run.withSuccessHandler(function(s){ laSetSess(s); cb(s); }).withFailureHandler(function(){ cb(laSess()); }).laRedeem(t);
}
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-lanav]') : null; if (!b) return;
  e.preventDefault(); var x = String(b.getAttribute('data-lanav')).split(':');
  laNav(x[0], x[0] === 'person' ? { personId: x[1] } : x[0] === 'area' ? { area: x[1] } : {});
});</script></head><body>
<header class="top"><div class="ttl"><b>Learning &amp; Assessment</b><span id="who">CHDCP · CCM</span></div><button class="chip" id="out" style="display:none">Sair</button></header>
<main id="app"><div class="load">…</div></main>
<script>
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2800); }
function dmy(s){ var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3]+'/'+m[2]+'/'+m[1] : ''; }
function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function call(fn, args, ms){
  return new Promise(function(ok, ko){
    var done = false, tm = setTimeout(function(){ if (!done){ done = true; ko(new Error('TIMEOUT')); } }, ms || 40000);
    var r = google.script.run.withSuccessHandler(function(v){ if (!done){ done = true; clearTimeout(tm); ok(v); } })
      .withFailureHandler(function(e){ if (!done){ done = true; clearTimeout(tm); ko(new Error(e && e.message ? e.message : String(e))); } });

function isNet(m){ return /TIMEOUT|NetworkError|HTTP 0|Failed to fetch|network|Load failed/i.test(String(m||'')); }
var ERR = { 'LA:SESSION':'A sessão expirou. Entre de novo.', 'LA:AREA':'Esta área não está entre as suas.', 'LA:NOACTIVITY':'Actividade não encontrada no Training Hub.',
  'LA:FUTURE':'Data futura: só é possível registar a partir do dia da actividade.', 'LA:MAX':'Nota máxima inválida.', 'LA:EMPTY':'Introduza pelo menos uma nota.',
  'LA:PERSON':'Pessoa desconhecida no Training Hub.', 'LA:SCORE':'Nota fora do intervalo para', 'LA:BUSY':'Sistema ocupado: tente de novo.', 'LA:DATA':'Pedido inválido.',
  'LA:TICKET':'Ligação inválida: abra de novo a partir da Agenda.', 'LA:EXPIRED':'Ligação expirada: abra de novo a partir da Agenda.', 'LA:USED':'Ligação já usada.', 'LA:NOLINK':'Learning & Assessment ainda não ligado à Agenda.' };
function errTxt(m){ m = String(m||''); var k = (m.match(/LA:[A-Z]+/) || [''])[0]; var x = m.split('|')[1]; return ERR[k] ? ERR[k] + (x ? ' ' + x : '') : (isNet(m) ? 'Sem ligação ao servidor. Tente de novo.' : m); }
/* autenticação: sessão da Agenda ou nome + PIN (TOJ / Painel) */
function authNow(){ var s = laSess(); if (s && s.sess) return { sess: s.sess, name: s.name }; return store('chdcp_toj_v2_auth') || store('rs_auth') || null; }

var HOME = null;
function render(m){
  HOME = m; $('who').textContent = m.name || 'CHDCP · CCM'; $('out').style.display = '';
  var h = '<img class="logo" src="logo.png" alt="Improving Cardiac Surgery in Angola">';
  if (m.toj || m.theory) {
    h += '<div class="sec">Avaliações</div><div class="tiles">' +
      (m.toj ? '<button class="tile" data-go="toj"><span class="ic">🩺</span><b>Avaliação TOJ</b><small>No posto de trabalho, por skill</small></button>' : '') +
      (m.theory ? '<button class="tile" data-go="theory"><span class="ic">📝</span><b>Avaliação teórica</b><small>Notas das provas escritas</small></button>' : '') + '</div>';
  }
  var r = m.results;
  if (r && r.role !== 'SELF') {
    h += '<div class="sec">Resultados</div><div class="tiles">' +
      (r.role === 'SUPER' ? '<button class="tile" data-go="results"><span class="ic">🌍</span><b>Todas as áreas</b><small>Visão geral</small></button>' : '') +
      '<button class="tile" data-go="area"><span class="ic">📊</span><b>' + (r.role === 'SUPER' ? 'Por área' : 'Minha área') + '</b><small>' + esc((r.areas || []).join(', ') || 'Competências e evolução') + '</small></button>' +
      '<button class="tile" data-go="people"><span class="ic">👥</span><b>Formandos</b><small>Perfil individual</small></button></div>';
  }
  if (m.pid) h += '<div class="sec">Meu percurso</div><div class="tiles"><button class="tile" data-go="me"><span class="ic">🎓</span><b>Meu perfil</b><small>Os meus resultados</small></button></div>';
  if (!m.toj && !(r && r.role !== 'SELF') && !m.pid) h += '<div class="card note" style="margin-top:14px">O seu utilizador ainda não tem funções em Learning &amp; Assessment. Fale com o administrador.</div>';
  h += '<p class="note" style="text-align:center;margin-top:22px">CHDCP Learning &amp; Assessment · v' + esc(LA.v || '') + '</p>';
  $('app').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(b){
    b.onclick = function(){
      var g = b.getAttribute('data-go');
      if (g === 'toj') laNav('toj'); else if (g === 'theory') laNav('theory');
      else if (g === 'results') laNav('results'); else if (g === 'area') laNav('area'); else if (g === 'people') laNav('results', { tab: 'people' });
      else if (g === 'me') laNav('person', { personId: m.pid });
    };
  });
}
function login(names, err){
  $('who').textContent = 'CHDCP · CCM'; $('out').style.display = 'none';
  $('app').innerHTML = '<img class="logo" src="logo.png" alt="Improving Cardiac Surgery in Angola"><div class="card"><b>Entrar</b>' +
    '<label class="field">Nome</label><select class="inp" id="ln"><option value="">— escolha —</option>' + names.map(function(n){ return '<option>' + esc(n) + '</option>'; }).join('') + '</select>' +
    '<label class="field">PIN</label><input class="inp" id="lp" type="password" inputmode="numeric" autocomplete="current-password">' +
    '<div class="err" id="le">' + esc(err || '') + '</div><button class="btn" id="lb">Entrar</button></div>' +

    var a = { name: $('ln').value, pin: $('lp').value.trim() };

    $('lb').disabled = true;
    call('laHome', [a]).then(function(m){
      if (m.needLogin) { $('lb').disabled = false; $('le').textContent = 'PIN errado.'; return; }
      store('chdcp_toj_v2_auth', { name: a.name, pin: a.pin }); store('rs_auth', { name: a.name, pin: a.pin }); laSetSess(null);

function showLogin(err){ call('laLoginList', []).then(function(n){ login(n, err); }).catch(function(e){ $('app').innerHTML = '<div class="card err">' + esc(errTxt(e.message)) + '</div>'; }); }

laReady(function(){
  var a = authNow();
  var cached = store('la_home');
  if (cached && a) render(cached);
  if (!a) { showLogin(''); return; }
  call('laHome', [a]).then(function(m){
    if (m.needLogin) { laSetSess(null); store('la_home', null); showLogin(m.expired ? 'A sessão expirou.' : ''); return; }
    store('la_home', m); render(m);
  }).catch(function(e){ if (!cached) $('app').innerHTML = '<div class="card err">' + esc(errTxt(e.message)) + '</div>'; });
});
