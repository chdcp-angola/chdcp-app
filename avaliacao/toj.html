<style>
:root{
  --brand:#7d1d1a; --brand-soft:#f6eceb; --ink:#1b2124; --muted:#65727a; --faint:#93a0a7; --line:#e2e7ea;
  --bg:#f2f4f5; --card:#ffffff; --ok:#11804a; --ok-soft:#e5f4ec; --warn:#a46a00; --warn-soft:#fff4d9; --bad:#b8322f; --bad-soft:#fbe7e5; --info:#235fb8; --info-soft:#eaf2fd;
  --l1:#b8322f; --l2:#eda39e; --l3:#dcd9d2; --l4:#86b6ef; --l5:#256abf;
  --r:14px; --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:3px solid #f0b64b;outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;min-height:56px}
.top .back{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-left:-6px;font-size:1.6rem;line-height:1}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:.78rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:#fff;padding:5px 9px;font-size:.76rem;min-width:34px}
.lang button[aria-pressed=true]{background:#fff;color:var(--brand);font-weight:700}

main{max-width:760px;margin:0 auto;padding:12px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 4px 8px}
.sec h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sec span{font-size:.8rem;color:var(--faint)}

.ctx{display:flex;gap:8px;align-items:center}
.days{display:flex;flex:1;background:#e4e8ea;border-radius:999px;padding:3px;gap:2px;min-width:0}
.days button,.days label{flex:1;border:0;background:none;border-radius:999px;padding:7px 6px;font-size:.88rem;color:var(--muted);font-weight:600;text-align:center;position:relative;white-space:nowrap;min-height:36px;display:flex;align-items:center;justify-content:center}
.days [aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.days input{position:absolute;inset:0;opacity:0;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:42px;font-size:.92rem;position:relative}
.pill[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.sel{padding-right:30px}
.pill.sel select{position:absolute;inset:0;opacity:0;width:100%}
.pill.sel::after{content:"▾";position:absolute;right:12px;font-size:.8rem;color:var(--muted)}
.pill.date input{position:absolute;inset:0;opacity:0;width:100%}
.mode{margin-top:10px;display:flex;gap:10px;align-items:center;font-size:.82rem;background:var(--info-soft);border-radius:10px;padding:8px 12px;color:#183f78}
.mode b{display:block;font-size:.92rem}
.mode .link{margin-left:auto;flex:none}
.link{background:none;border:0;color:var(--brand);font-weight:700;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

.search{position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 44px 13px 42px;min-height:var(--tap);background:#fff;font-size:1rem;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--faint);font-size:1.1rem}

.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);min-height:62px}
.prow:first-child{border-top:0}
.prow .chk{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--av,#e7ecef);display:grid;place-items:center;color:#41505a;font-size:.8rem;font-weight:800;letter-spacing:.02em}
.prow .chk[aria-pressed=true]{background:var(--brand);color:#fff;font-size:1.05rem}
.prow .main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 0}
.prow .main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .main span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.tag.due{background:var(--warn-soft);color:var(--warn)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.last,.tag.never{display:none}
mark{background:#ffe8a3;color:inherit;border-radius:3px;padding:0 1px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fafbfb;padding:12px;color:var(--brand);font-weight:700}
.empty{color:var(--muted);padding:16px;text-align:center;font-size:.92rem}
.recent{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rc{flex:none;width:64px;border:0;background:none;text-align:center;font-size:.74rem;color:var(--ink);padding:0}
.rc i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:var(--av,#e7ecef);font-style:normal;font-weight:800;font-size:.95rem;color:#41505a;position:relative}
.rc i.ok::after{content:'✓';position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:.7rem;display:grid;place-items:center;border:2px solid var(--bg)}
.rc span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:.8rem;color:var(--faint);text-align:center;margin:10px 0 0}

.banner{border-radius:12px;padding:10px 12px;font-size:.88rem;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-soft);border:1px solid #efd58a}
.banner.ok{background:var(--ok-soft);border:1px solid #b9e0c9}
.banner.err{background:var(--bad-soft);border:1px solid #efbab4}
.banner .link{margin-left:auto}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.bar .info{flex:1;min-width:0;font-size:.8rem;color:var(--muted);line-height:1.3;white-space:nowrap}
.bar .info b{color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:var(--tap);font-weight:700;background:var(--brand);color:#fff;white-space:nowrap}
.btn:disabled{opacity:.35}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}

.tabs{position:sticky;top:56px;z-index:15;background:var(--bg);padding:8px 0 8px;margin:-4px 0 4px}
.segrow{display:flex;gap:6px;align-items:stretch}
.segrow .seg{flex:1}
.sbtn{flex:none;width:46px;border:0;border-radius:12px;background:#e4e8ea;color:var(--muted);display:grid;place-items:center;position:relative}
.sbtn .ico{position:static;transform:none}
.sbtn[aria-pressed=true]{background:var(--ink);color:#fff}
.people{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.pchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px 6px 12px;font-size:.85rem;display:flex;align-items:center;gap:6px;max-width:220px;min-height:38px}
.pchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip i{font-style:normal;font-size:.72rem;font-weight:700;background:#eef1f3;color:var(--muted);border-radius:999px;padding:1px 7px}
.pchip[aria-current=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.pchip[aria-current=true] i{background:rgba(255,255,255,.22);color:#fff}
.seg{display:flex;background:#e4e8ea;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:.86rem;min-height:40px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button i{font-style:normal;font-weight:700;opacity:.7;margin-left:3px}
.prog{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:.76rem;color:var(--muted)}
.prog .track{flex:1;height:6px;background:#dde3e6;border-radius:3px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .25s}
.ssearch{margin-top:8px}
.ssearch input{min-height:42px;padding-top:9px;padding-bottom:9px}

.group{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;padding:13px 14px;text-align:left}
.ghead b{flex:1;font-size:.82rem;color:var(--brand);text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.ghead span{font-size:.8rem;color:var(--muted);white-space:nowrap;font-weight:600}
.ghead span.ok{color:var(--ok)}
.ghead::after{content:"▾";color:var(--faint);transition:transform .2s}
.group.closed .ghead::after{transform:rotate(-90deg)}
.group.closed .gbody{display:none}

.skill{border-top:1px solid var(--line);padding:12px 14px;scroll-margin-top:190px;transition:background .4s}
.skill.flash{background:#fff7e0}
.skill .row1{display:flex;gap:6px;align-items:flex-start}
.skill .desc{flex:1;font-size:.98rem;line-height:1.3}
.skill .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:5px;font-size:.76rem;color:var(--muted)}
.badge{font-size:.66rem;font-weight:800;border-radius:5px;padding:2px 6px;letter-spacing:.03em}
.badge.plan{background:var(--info-soft);color:var(--info)}
.badge.never{background:none;color:var(--faint);font-weight:600;letter-spacing:0;padding:0;font-size:.74rem}
.lastv{display:inline-flex;align-items:center;gap:5px}
.lastv i{font-style:normal;display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:5px;font-weight:800;font-size:.72rem}
.nbtn{flex:none;border:0;background:none;width:40px;height:40px;border-radius:50%;color:var(--faint);margin:-8px -8px 0 0;display:grid;place-items:center}
.nbtn svg{width:19px;height:19px}
.nbtn.has{color:var(--brand)}
.rate{display:grid;grid-template-columns:repeat(5,1fr) 1.2fr;gap:6px;margin-top:10px}
.rate button{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:1.1rem;position:relative}
.rate button:active{transform:scale(.96)}
.rate button.na{font-size:.7rem;font-weight:700;color:var(--muted);line-height:1.1;padding:0 2px}
.rate button.was::after{content:"";position:absolute;left:50%;bottom:5px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:#b7c0c5}
.rate button[aria-pressed=true].v1{background:var(--l1);border-color:var(--l1);color:#fff}
.rate button[aria-pressed=true].v2{background:var(--l2);border-color:#d88882}
.rate button[aria-pressed=true].v3{background:var(--l3);border-color:#b2ada3}
.rate button[aria-pressed=true].v4{background:var(--l4);border-color:#5c97dd}
.rate button[aria-pressed=true].v5{background:var(--l5);border-color:var(--l5);color:#fff}
.rate button[aria-pressed=true].na{background:var(--ink);border-color:var(--ink);color:#fff}
.rate button[aria-pressed=true].was::after{background:currentColor;opacity:.55}
.picked{margin-top:7px;font-size:.8rem;color:var(--muted);min-height:1.15em}
.picked b{color:var(--ink)}
.up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}
.skill textarea,.rcard textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:60px;resize:vertical}
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:12px}
.legend div{font-size:.66rem;line-height:1.15;text-align:center;color:var(--muted)}
.legend i{display:block;height:5px;border-radius:3px;margin-bottom:3px}
.opts{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 0;font-size:.85rem;color:var(--muted)}
.opts input{width:20px;height:20px}

.sheet{position:fixed;inset:0;background:rgba(18,22,24,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .panel{background:#fff;border-radius:18px 18px 0 0;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#d3d9dc;margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:1.15rem}
.rcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.rcard .rh{display:flex;align-items:center;gap:8px}
.rcard .rh b{flex:1;min-width:0}
.rcard .rh small{font-size:.78rem;color:var(--muted);white-space:nowrap}
.rlist{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:.86rem;margin-top:10px;align-items:start}
.rlist .lv{font-weight:800;text-align:center;border-radius:6px;padding:1px 8px;min-width:30px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.done{text-align:center;padding:12px 0 4px}
.done .big{width:68px;height:68px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:2rem;margin:6px auto 12px}
.done .big.wait{background:var(--warn)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.loading{text-align:center;color:var(--muted);padding:80px 20px}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;min-height:46px}
.crumb b{flex:1;min-width:0;font-size:.9rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.crumb.top0{padding-left:12px}
.cback{flex:none;border:0;background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:9px;padding:8px 10px;font-size:.84rem;min-height:38px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:118px;position:relative}
.tile b{font-size:.93rem;line-height:1.22;flex:1}
.tile .tp{display:flex;gap:6px;flex-wrap:wrap;min-height:18px}
.tile .track{height:6px;background:#e4e9ec;border-radius:3px;overflow:hidden}
.tile .track i{display:block;height:100%;background:var(--ok);border-radius:3px}
.tile small{font-size:.76rem;color:var(--muted);font-weight:600}
.tile.full{border-color:#b9e0c9;background:#f6fbf8}
.tile.full::after{content:'✓';position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:.75rem;display:grid;place-items:center}
.tile.plan{grid-column:1/-1;background:var(--info-soft);border-color:#c5d9f5;min-height:0}
.tile.plan b{color:#183f78;font-size:1rem;flex:none}
.tile.plan small{color:#3a5f93}
.tile:active{transform:scale(.98)}
.ghead.static{cursor:default}
.ghead.static::after{content:none}
.nextg{width:100%;margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;white-space:normal}
.nextg span{font-size:.75rem;font-weight:600;opacity:.75;display:block}
.nextg.flash{box-shadow:0 0 0 4px #f0b64b}
.gdone{text-align:center;color:var(--ok);font-weight:700;font-size:.9rem;margin:6px 0 10px}
.osec{margin-top:18px}
.osec p{margin:-4px 4px 8px;font-size:.8rem;color:var(--faint)}
.group.other .ghead b{color:var(--muted)}
.pin{width:100%;font-size:1.6rem;letter-spacing:.5em;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.err{color:var(--bad);font-size:.88rem;margin-top:8px;min-height:1.2em}
.foot{text-align:center;font-size:.82rem;color:var(--muted);margin-top:18px}
.ibtn{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.ibtn svg{width:19px;height:19px}
.ovbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;text-align:left;font-weight:700;color:var(--brand)}
.ovbtn svg{width:20px;height:20px;flex:none}
.ovbtn span{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:1.4rem;line-height:1.15}
.kpi b small{font-size:.85rem;color:var(--faint);font-weight:600}
.kpi span{font-size:.76rem;color:var(--muted);font-weight:600}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}

function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function scorePerson(p, q){
  var words = p._w, idDigits = p.id.replace(/\D/g,'').replace(/^0+/,''), toks = q.split(' '), score = 0;
  for (var i=0;i<toks.length;i++){
    var tk = toks[i]; if (!tk) continue;
    if (/^\d+$/.test(tk)) { if (idDigits.indexOf(tk.replace(/^0+/,'')) >= 0) { score += 4; continue; } return 0; }
    var w = words.findIndex(function(x){ return x.indexOf(tk) === 0; });
    if (w === 0) { score += 5; continue; }
    if (w > 0) { score += 3; continue; }
    if (p._n.indexOf(tk) >= 0 && tk.length >= 3) { score += 1; continue; }
    if (toks.length === 1 && tk.length >= 2 && p._i.indexOf(tk) === 0) { score += 2; continue; }
    return 0;
  }
  return score;
}
function hl(text, q){
  var src = String(text || '');
  if (!q) return esc(src);
  var low = src.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if (low.length !== src.length) return esc(src);
  var marks = []; q.split(' ').filter(function(x){ return x && !/^\d+$/.test(x); }).forEach(function(tk){
    var re = new RegExp('(^|[^a-z0-9])(' + tk.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'g'), m;
    while ((m = re.exec(low))) { var st = m.index + m[1].length; for (var k = st; k < st + tk.length; k++) marks[k] = 1; }
  });
  var out = ''; for (var i=0;i<src.length;i++){ if (marks[i] && !marks[i-1]) out += '<mark>'; out += esc(src[i]); if (marks[i] && !marks[i+1]) out += '</mark>'; }
  return out;
}

  } else {
    var area = DATA.people.filter(inArea), p = plan();
    var byOld = function(a,b){ return (lastOf(a.id)||'0').localeCompare(lastOf(b.id)||'0') || a.name.localeCompare(b.name); };
    var byName = function(a,b){ return a.name.localeCompare(b.name); };

    if (selP.length) h += sec(t('sel_title'), selP.length) + '<div class="list">'+selP.map(function(x){ return prow(x); }).join('')+'</div>';
    var rest = area.filter(function(x){ return S.sel.indexOf(x.id) < 0; });
    if (p) {
      var due = rest.filter(function(x){ return statusOf(x.id).k === 'due'; }).sort(byName);
      var done = rest.filter(function(x){ return statusOf(x.id).k === 'done'; }).sort(byName);
      h += sec(t('due'), due.length) + '<div class="list">'+(due.length ? due.slice(0, LIMIT).map(function(x){ return prow(x); }).join('') : '<div class="empty">✓</div>')+
        (due.length > LIMIT ? '<button class="more" type="button" id="more">'+t('show_more',{n:Math.min(40, due.length-LIMIT)})+'</button>' : '')+'</div>';
      if (done.length) h += sec(t('done_plan'), done.length) + '<div class="list">'+done.map(function(x){ return prow(x); }).join('')+'</div>';
    } else {
      var old = rest.slice().sort(byOld).slice(0, 6);
      if (old.length) h += sec(t('due_np'), '') + '<div class="list">'+old.map(function(x){ return prow(x); }).join('')+'</div>';
      var others = rest.filter(function(x){ return old.indexOf(x) < 0; }).sort(byName);
      if (others.length) h += sec(t('all',{a:S.area}), area.length) + '<div class="list">'+others.slice(0, LIMIT).map(function(x){ return prow(x); }).join('')+
        (others.length > LIMIT ? '<button class="more" type="button" id="more">'+t('show_more',{n:Math.min(40, others.length-LIMIT)})+'</button>' : '')+'</div>';
    }
  }
  box.innerHTML = h;
  each('[data-sel]', function(b){ b.onclick = function(){ buzz(); toggleSel(b.dataset.sel); var on = S.sel.indexOf(b.dataset.sel) >= 0; each('[data-sel="'+b.dataset.sel+'"]', function(x){ x.setAttribute('aria-pressed', String(on)); x.textContent = on ? '✓' : x.dataset.ini; }); homeBar(); }; }, box);
  each('[data-open]', function(b){ b.onclick = function(){ var id = b.dataset.open; if (S.sel.length) { toggleSel(id); renderPeople(); homeBar(); return; } startSession([id]); }; }, box);
  each('[data-card]', function(b){ b.onclick = function(){ openCard(b.dataset.card); }; }, box);
  if ($('more')) $('more').onclick = function(){ LIMIT += 40; renderPeople(); };
}
function toggleSel(id){ var i = S.sel.indexOf(id); if (i >= 0) S.sel.splice(i,1); else S.sel.push(id); }
function homeBar(){
  var bar = $('bar');
  if (!S.sel.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  $('barIn').innerHTML = '<div class="info">'+t('selected',{n:S.sel.length})+'<br><button class="link" type="button" id="selClear" style="padding:2px 0">'+t('clear')+'</button></div>'+
    '<button class="btn" type="button" id="selGo">'+t('start_n',{n:S.sel.length})+'</button>';
  $('selClear').onclick = function(){ S.sel = []; renderPeople(); homeBar(); };
  $('selGo').onclick = function(){ startSession(S.sel.slice()); };
}
/* v25: skill già valutate (1-5) per lo stesso trainee nella stessa data: Hub, invii, coda sul telefono */
function dupSkills(id){
  var m = S.r[id] || {}, h = HIST[id] || {}, out = store.get(KEY.out, []), res = [];
  skillsOfArea().forEach(function(s){
    var v = m[s.code]; if (!v || v === 'NA') return;
    var seen = h[s.code] && (h[s.code].ds || []).indexOf(S.date) >= 0;
    if (!seen) seen = out.some(function(o){ return o.personId === id && o.date === S.date && (o.ratings||[]).some(function(r){ return r.code === s.code && r.score !== ''; }); });
    if (seen) res.push(s);
  });
  return res;
}
/* v27: mappa dei voti per la vista corrente (per skill = skill valutate da tutti i trainee della sessione) */
function multiOn(){ return !!S.bs && S.session.length > 1; }
function curMap(){
  if (!multiOn()) return S.r[S.cur] || {};
  var o = {};
  skillsOfArea().forEach(function(s){ if (S.session.every(function(id){ return (S.r[id]||{})[s.code]; })) o[s.code] = 1; });
  return o;
}
function qnHtml(){ return '<div class="qn">'+(T[LANG].qn||T.PT.qn).map(function(x){ return '<button type="button" data-qn="'+esc(x)+'">'+esc(x)+'</button>'; }).join('')+'</div>'; }
function addQn(ta, txt){ var b = ta.value.replace(/\s+$/,''); ta.value = (b ? b+'; ' : '') + txt; if (ta.oninput) ta.oninput(); }
function startSession(ids){
  NAV = []; S.bs = false; S.session = ids; S.cur = ids[0]; S.sel = []; S.sq = ''; S.searchOpen = false; DRAFT_FOUND = false; MACRO_PUSHED = false;

}

  if (S.macro === PLANK && !planCodes().length) S.macro = '';

/* ---- macro skill ---- */
var PLANK = '__plan', MACRO_PUSHED = false;
function LI(){ return LANG === 'EN' ? 0 : LANG === 'IT' ? 2 : 1; }
function mLabel(s){ return s.ml ? s.ml[LI()] : s.mk; }
function sDesc(s){ return (s.dl && s.dl[LI()]) || s.desc; }
function sLabel(s){ return s.sl ? s.sl[LI()] : ''; }
function planSet(){ var o = {}; planCodes().forEach(function(c){ o[c] = 1; }); return o; }
function groupBy(list, keyFn, labFn){
  var out = [], ix = {};
  list.forEach(function(s){ var k = keyFn(s); if (ix[k] == null) { ix[k] = out.length; out.push({ key:k, name:labFn(s), items:[] }); } out[ix[k]].items.push(s); });
  return out;
}
function byMacro(list){ var g = groupBy(list, function(s){ return s.mk; }, mLabel); g.forEach(function(x, i){ x.o = x.items[0].mo; x.i = i; }); return g.sort(function(a, b){ return a.o - b.o || a.i - b.i; }); }
function macrosOfArea(){ return byMacro(skillsOfArea()); }
function macroName(key){ if (key === PLANK) return t('t_plan'); var g = macrosOfArea().filter(function(x){ return x.key === key; })[0]; return g ? g.name : key; }
function doneIn(items, m){ return items.filter(function(s){ return m[s.code]; }).length; }

/* lista mostrata, nello stesso ordine del rendering (serve all'avanzamento automatico) */
function viewGroups(){
  var all = skillsOfArea(), q = norm(S.sq);
  if (q) {
    var hit = all.filter(function(s){ var hay = norm(s.code+' '+(s.dl ? s.dl.join(' ') : s.desc)+' '+sLabel(s)); return q.split(' ').every(function(tk){ return hay.indexOf(tk) >= 0; }); });
    return byMacro(hit);
  }
  if (S.macro === PLANK) { var ps = planSet(); return byMacro(all.filter(function(s){ return ps[s.code]; })); }
  if (S.macro) return groupBy(all.filter(function(s){ return s.mk === S.macro; }), function(s){ return s.sl ? s.sl[0] : ''; }, sLabel);
  return [];
}
function visibleSkills(){ var out = []; viewGroups().forEach(function(g){ out = out.concat(g.items); }); return out; }

function renderTabs(){
  var all = skillsOfArea(), m = S.r[S.cur] || {}, h = '';
  if (S.session.length > 1) h += '<div class="seg bsw"><button type="button" data-bs="0" aria-pressed="'+!S.bs+'">'+t('by_p')+'</button><button type="button" data-bs="1" aria-pressed="'+!!S.bs+'">'+t('by_s')+'</button></div>';
  if (S.session.length > 1 && !S.bs) h += '<div class="people" role="tablist">'+S.session.map(function(id){
    var pp = personById(id), cc = counts(id);
    return '<button class="pchip" role="tab" type="button" data-p="'+esc(id)+'" aria-current="'+(id===S.cur)+'"><span>'+esc(pp.name.split(' ').slice(0,2).join(' '))+'</span><i>'+cc.t+'</i></button>';
  }).join('')+'</div>';
  var searching = S.searchOpen || !!S.sq, multi = macrosOfArea().length > 1 || planCodes().length;
  h += '<div class="segrow">'+
    (S.macro && multi ? '<div class="crumb"><button class="cback" type="button" id="toTiles">‹ '+t('groups')+'</button><b>'+esc(macroName(S.macro))+'</b></div>'
                      : '<div class="crumb top0"><b>'+esc(S.macro ? macroName(S.macro) : t('choose_g'))+'</b></div>')+
    (multiOn() ? '' : '<button class="sbtn" type="button" id="cardOpen" aria-label="'+t('card')+'">'+ICON_CARD+'</button>')+
    '<button class="sbtn" type="button" id="sOpen" aria-pressed="'+searching+'" aria-label="'+t('s_search')+'">'+ICON_SEARCH.replace('class="ico"','class="ico" style="width:20px;height:20px"')+'</button></div>';
  h += '<div class="prog"><div class="track"><i></i></div><span></span></div>';
  h += '<div class="search ssearch'+(searching?'':' hidden')+'">'+ICON_SEARCH+'<input type="search" id="sq" value="'+esc(S.sq)+'" placeholder="'+t('s_search')+'" autocomplete="off" enterkeyhint="search"><button class="clear" id="sqx" type="button" aria-label="×">✕</button></div>';
  $('tabs').innerHTML = h;
  progress();
  each('[data-p]', function(b){ b.onclick = function(){ S.cur = b.dataset.p; S.sq = ''; save(); renderAssess(); window.scrollTo(0,0); }; });
  each('[data-bs]', function(b){ b.onclick = function(){ S.bs = b.dataset.bs === '1'; save(); renderAssess(); window.scrollTo(0,0); }; });
  if ($('toTiles')) $('toTiles').onclick = function(){ if (MACRO_PUSHED) { history.back(); } else toTiles(); };
  $('sq').oninput = function(e){ S.sq = e.target.value; renderSkills(); progress(); };
  $('sqx').onclick = function(){ S.sq = ''; S.searchOpen = false; renderTabs(); renderSkills(); };
  $('sOpen').onclick = function(){ if (S.searchOpen || S.sq) { S.sq = ''; S.searchOpen = false; renderTabs(); renderSkills(); } else { S.searchOpen = true; renderTabs(); $('sq').focus(); } };
  if ($('cardOpen')) $('cardOpen').onclick = function(){ openCard(S.cur); };
  var cur = document.querySelector('.pchip[aria-current=true]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline:'center', block:'nearest' });
}
function progress(){
  var m = curMap(), base, dn, lab;
  if (S.macro && !S.sq) { var v = visibleSkills(); base = v.length; dn = doneIn(v, m); lab = t('of_grp',{d:dn,n:base}); }
  else if (planCodes().length) { var pc = planCodes(); base = pc.length; dn = pc.filter(function(c){ return m[c]; }).length; lab = t('of_plan',{d:dn,n:base}); }
  else { base = skillsOfArea().length; dn = doneIn(skillsOfArea(), m); lab = t('of_all',{d:dn,n:base}); }
  var bar = document.querySelector('.prog .track i'); if (bar) bar.style.width = (base ? Math.round(dn/base*100) : 0)+'%';
  var sp = document.querySelector('.prog span'); if (sp) sp.textContent = lab;
}
function toTiles(){ S.macro = ''; S.sq = ''; S.searchOpen = false; save(); renderTabs(); renderSkills(); window.scrollTo(0,0); }
function openMacro(key, push){
  S.macro = key; S.sq = ''; S.searchOpen = false; save();
  if (push && !MACRO_PUSHED) { try { history.pushState({v:'macro'}, ''); MACRO_PUSHED = true; } catch(e){} }
  renderTabs(); renderSkills(); window.scrollTo(0,0);
}
/* prossimo macro-gruppo con skill ancora da valutare (dopo quello corrente, poi dall'inizio) */
function nextMacro(){
  var ms = macrosOfArea(), m = curMap(), i = -1;
  ms.forEach(function(g, k){ if (g.key === S.macro) i = k; });
  for (var k = 1; k <= ms.length; k++) { var g = ms[(i + k) % ms.length]; if (g.key !== S.macro && doneIn(g.items, m) < g.items.length) return g; }
  return null;
}

function renderSkills(){
  var box = $('skills'); if (!box) return;
  var m = curMap(), notes = S.n[S.cur] || {}, hist = HIST[S.cur] || {}, ps = planSet(), h = '';
  if (!skillsOfArea().length) { box.innerHTML = '<div class="card empty">'+t('no_skills')+'</div>'; return; }

  /* riquadri */
  if (!S.macro && !S.sq) {
    var tile = function(key, name, items, isPlan, sub){
      var d = doneIn(items, m), n = items.length, pn = isPlan ? 0 : items.filter(function(s){ return ps[s.code]; }).length;
      return '<button class="tile'+(isPlan?' plan':'')+(d===n?' full':'')+'" type="button" data-m="'+esc(key)+'"><b>'+esc(name)+'</b>'+
        (sub ? '<small>'+esc(sub)+'</small>' : '')+
        '<span class="tp">'+(pn ? '<i class="badge plan">'+t('n_plan',{n:pn})+'</i>' : '')+'</span>'+
        '<div class="track"><i style="width:'+(n ? Math.round(d/n*100) : 0)+'%"></i></div><small>'+d+' / '+n+'</small></button>';
    };
    h += '<div class="tiles">';
    var pc = planCodes(), pl = plan();
    if (pc.length) h += tile(PLANK, t('t_plan'), skillsOfArea().filter(function(s){ return ps[s.code]; }), true, t('t_plan_d',{n:pc.length,s:dm(pl.start),e:dm(pl.end)}));
    macrosOfArea().forEach(function(g){ h += tile(g.key, g.name, g.items, false); });
    h += '</div>';
    h += '<div class="legend" aria-hidden="true">'+[1,2,3,4,5].map(function(i){ return '<div><i style="background:var(--l'+i+')"></i><b>'+i+'</b> '+t('ls'+i)+'</div>'; }).join('')+'</div>';
    box.innerHTML = h;
    each('[data-m]', function(b){ b.onclick = function(){ buzz(); openMacro(b.dataset.m, true); }; }, box);
    return;
  }

  /* lista del gruppo (o risultati della ricerca) */
  var groups = viewGroups(), list = visibleSkills();
  if (S.sq) h += '<div class="sec"><h2>'+t('in_search')+'</h2><span>'+list.length+'</span></div>';
  if (!list.length) h += '<div class="card empty">'+(S.sq ? '—' : t('all_done'))+'</div>';
  groups.forEach(function(g){
    var d = doneIn(g.items, m), named = !!g.name && (groups.length > 1 || S.sq || S.macro === PLANK);
    h += '<section class="group" data-g="'+esc(g.key)+'">'+(named ? '<div class="ghead static"><b>'+esc(g.name)+'</b><span class="'+(d===g.items.length?'ok':'')+'">'+d+'/'+g.items.length+'</span></div>' : '')+'<div class="gbody">';
    g.items.forEach(function(s){ h += multiOn() ? skillMultiHtml(s, ps[s.code]) : skillHtml(s, m[s.code], notes[s.code], hist[s.code], ps[s.code]); });
    h += '</div></section>';
  });
  if (!S.sq) {
    var pending = list.filter(function(s){ return !m[s.code]; }).length;
    if (!pending && list.length) h += '<div class="gdone">'+t('grp_done')+'</div>';
    if (pending) h += '<button class="btn ghost" type="button" id="markRest" style="width:100%;margin-bottom:10px;white-space:normal">'+t('mark_rest',{n:pending})+'</button>';
    var sameN = 0; list.forEach(function(s){ (multiOn() ? S.session : [S.cur]).forEach(function(id){ if (!(S.r[id]||{})[s.code] && (HIST[id]||{})[s.code]) sameN++; }); });
    if (sameN) h += '<button class="btn ghost" type="button" id="sameRest" style="width:100%;margin-bottom:10px;white-space:normal">'+t('same_rest',{n:sameN})+'</button>';
    if (S.macro === PLANK) {
      h += '<button class="btn nextg" type="button" id="nextG"><div>'+t('others_go',{a:S.area})+'<span>'+t('next_go')+'</span></div><b>→</b></button>';
    } else if (macrosOfArea().length > 1) {
      var nx = nextMacro();
      h += nx ? '<button class="btn nextg" type="button" id="nextG" data-nx="'+esc(nx.key)+'"><div><span>'+t('next_g')+'</span>'+esc(nx.name)+'</div><b>→</b></button>'
              : '<button class="btn nextg" type="button" id="nextG"><div>'+t('next_go')+'</div><b>→</b></button>';
    }
  }
  h += '<label class="opts"><input type="checkbox" id="auto" '+(S.auto?'checked':'')+'> '+t('auto_adv')+'</label>';
  h += '<div class="legend" aria-hidden="true">'+[1,2,3,4,5].map(function(i){ return '<div><i style="background:var(--l'+i+')"></i><b>'+i+'</b> '+t('ls'+i)+'</div>'; }).join('')+'</div>';
  box.innerHTML = h;
  bindSkills(box);
}

function skillHtml(s, v, note, last, inPlan){
  var meta = '';
  if (inPlan && S.macro !== PLANK) meta += '<span class="badge plan">'+t('plan')+'</span>';
  if (S.sq && sLabel(s)) meta += '<span>'+esc(sLabel(s))+'</span>';
  if (last) meta += '<span class="lastv">'+t('last')+' <i style="background:var(--l'+last.s+');color:'+(last.s===1||last.s===5?'#fff':'#1b2124')+'">'+last.s+'</i>'+esc(last.d.slice(0,5))+'</span>';
  else if (HIST_OK[S.cur]) meta += '<span class="badge never">'+t('never')+'</span>';
  var btns = [1,2,3,4,5].map(function(i){
    return '<button type="button" role="radio" class="v'+i+(last && last.s===i?' was':'')+'" data-v="'+i+'" aria-checked="'+(v===i)+'" aria-pressed="'+(v===i)+'" aria-label="'+i+' – '+esc(t('lv'+i))+'">'+i+'</button>';
  }).join('') + '<button type="button" role="radio" class="na" data-v="NA" aria-checked="'+(v==='NA')+'" aria-pressed="'+(v==='NA')+'">'+t('na')+'</button>';
  return '<div class="skill" id="sk-'+esc(s.code)+'" data-code="'+esc(s.code)+'">'+
    '<div class="row1"><div class="desc">'+hl(sDesc(s), norm(S.sq))+'</div><button class="nbtn'+(note?' has':'')+'" type="button" data-note="1" aria-label="'+t('note')+'">'+ICON_NOTE+'</button></div>'+
    '<div class="meta">'+meta+'</div>'+
    '<div class="rate" role="radiogroup" aria-label="'+esc(sDesc(s))+'">'+btns+'</div>'+
    '<div class="picked">'+picked(v, last)+'</div>'+
    (S.openNote[S.cur+'|'+s.code] || note ? '<textarea data-nt="1" placeholder="'+t('note_ph')+'">'+esc(note||'')+'</textarea>'+qnHtml() : '')+
    '</div>';
}
function picked(v, last){
  if (!v) return last ? '<button class="same" type="button" data-same="1">'+t('same',{v:last.s})+'</button>' : '';
  if (v === 'NA') return '<b>'+t('na_l')+'</b>';
  var s = '<b>'+v+' · '+t('lv'+v)+'</b>';
  if (last) { var d = v - last.s; s += ' · '+t('vs_last',{v:last.s}) + (d>0?' <span class="up">▲ +'+d+'</span>':d<0?' <span class="down">▼ '+d+'</span>':' ='); }
  return s;
}

function bindSkills(box){
  each('.skill', function(row){
    if (row.classList.contains('multi')) return;
    var code = row.dataset.code;
    each('[data-v]', function(b){ b.onclick = function(){ rate(row, code, b.dataset.v === 'NA' ? 'NA' : Number(b.dataset.v)); }; }, row);
    row.querySelector('[data-note]').onclick = function(){
      S.openNote[S.cur+'|'+code] = true;
      var ta = row.querySelector('textarea');
      if (!ta) { row.insertAdjacentHTML('beforeend', '<textarea data-nt="1" placeholder="'+t('note_ph')+'"></textarea>'+qnHtml()); ta = row.querySelector('textarea'); bindNote(row, code); }
      ta.focus();
    };
    bindNote(row, code);
    row.addEventListener('click', function(e){
      var sb = e.target.closest('[data-same]'); if (sb) { var l = (HIST[S.cur]||{})[code]; if (l) rate(row, code, l.s); return; }
      var qb = e.target.closest('[data-qn]'); if (qb) { var ta = row.querySelector('textarea'); if (ta) addQn(ta, qb.dataset.qn); }
    });
  }, box);
  bindMulti(box);
  if ($('sameRest')) $('sameRest').onclick = function(){
    visibleSkills().forEach(function(s){ (multiOn() ? S.session : [S.cur]).forEach(function(id){ var m = S.r[id] = S.r[id] || {}, l = (HIST[id]||{})[s.code]; if (!m[s.code] && l) m[s.code] = l.s; }); });
    buzz(); save(); renderTabs(); renderSkills(); assessBar();
  };
  if ($('markRest')) $('markRest').onclick = function(){
    (multiOn() ? S.session : [S.cur]).forEach(function(id){ var m = S.r[id] = S.r[id] || {}; visibleSkills().forEach(function(s){ if (!m[s.code]) m[s.code] = 'NA'; }); });
    save(); renderTabs(); renderSkills(); assessBar();
  };
  if ($('nextG')) $('nextG').onclick = function(){ var k = $('nextG').dataset.nx; if (k) openMacro(k, true); else if (MACRO_PUSHED) history.back(); else toTiles(); };
  $('auto').onchange = function(e){ S.auto = e.target.checked; save(); };
}
function bindNote(row, code){
  var ta = row.querySelector('textarea'); if (!ta) return;
  ta.oninput = function(){ S.n[S.cur][code] = ta.value; row.querySelector('[data-note]').classList.toggle('has', !!ta.value); save(); };
}

function rate(row, code, v){
  buzz();
  var m = S.r[S.cur], first = !m[code];

    '<div class="kpi"><b>'+(n ? (sum/n).toFixed(1) : '–')+'</b><span>'+t('k_avg')+'</span></div>'+
    '<div class="kpi"><b>'+(n ? Math.round((dist[3]+dist[4])*100/n)+'%' : '–')+'</b><span>'+t('k_aut')+'</span></div>'+
    '<div class="kpi"><b>'+(last ? dm(last) : '–')+'</b><span>'+t('k_last')+'</span></div></div>';
  if (n) h += '<div class="dist" aria-hidden="true">'+dist.map(function(c, i){ return c ? '<i style="flex:'+c+';background:var(--l'+(i+1)+')"></i>' : ''; }).join('')+'</div>'+
    '<div class="distl">'+dist.map(function(c, i){ return c ? '<span>'+lvb(i+1)+' '+c+'</span>' : ''; }).join('')+'</div>';
  h += '<button class="btn ghost" type="button" id="showSt" style="width:100%;margin-top:12px">'+t('show_st')+'</button>';
  var need = needsOf(CARD), c = needCount(need);
  h += sec(t('todo_t'), need.length || '');
  if (!need.length) h += '<div class="list"><div class="empty">'+t('nothing')+'</div></div>';
  else {
    var lim = OV.all ? need.length : 8;
    h += '<div class="list">'+need.slice(0, lim).map(function(x){
      return '<div class="nrow"><div class="d">'+esc(sDesc(x.s))+'<small>'+esc(mLabel(x.s))+'</small></div>'+whyChip(x)+'</div>';
    }).join('')+(need.length > lim ? '<button class="more" type="button" id="needMore">'+t('show_more',{n:need.length-lim})+'</button>' : '')+'</div>';
    h += '<p class="hint">'+[c.plan?t('r_plan')+' '+c.plan:'', c.low?t('c_low',{n:c.low}):'', c.never?t('c_never',{n:c.never}):'', c.old?t('c_old',{n:c.old,d:OLD}):''].filter(Boolean).join(' · ')+'</p>';
  }
  h += sec(t('res_t'), '');
  byMacro(sk).forEach(function(g){
    var done = g.items.filter(function(s){ return r[s.code]; }).length;
    h += '<div class="group"><div class="ghead static"><b>'+esc(g.name)+'</b><span>'+done+'/'+g.items.length+'</span></div><div class="gbody">'+
      g.items.map(function(s){
        var x = r[s.code], tr = x && x[2] !== '' ? x[0] - x[2] : 0;
        return '<div class="nrow"><div class="d">'+esc(sDesc(s))+'<small>'+(x ? dmy(x[1])+(x[3] > 1 ? ' · '+x[3]+'×' : '')+(tr ? ' <span class="'+(tr>0?'up':'down')+'">'+(tr>0?'▲ +'+tr:'▼ '+tr)+'</span>' : '') : t('r_never'))+'</small></div>'+
          (x ? lvb(x[0]) : '<span class="lvb" style="background:#eef1f3;color:var(--faint)">–</span>')+'</div>';
      }).join('')+'</div></div>';
  });
  h += '<div id="extra"></div>';
  $('app').innerHTML = h;
  if ($('needMore')) $('needMore').onclick = function(){ OV.all = true; renderCard(); OV.all = false; };
  $('showSt').onclick = showStudent;
  fillExtra();
}
/* v27: presenze e prove teoriche (stesso calcolo della scheda DASH_PERSONA) */
var EXTRA = {};
function fillExtra(){
  var box = $('extra'); if (!box) return;
  var k = S.area+'|'+CARD, x = EXTRA[k], pid = CARD;
  if (!x) {
    box.innerHTML = sec(t('att_t'), '')+'<div class="list"><div class="empty">'+t('loading')+'</div></div>';
    call('tojAppPersonExtra',[pid, S.area, AUTH]).then(function(d){ EXTRA[k] = d || {}; if (VIEW === 'card' && CARD === pid) fillExtra(); })
      .catch(function(e){ if ($('extra')) $('extra').innerHTML = '<div class="banner err">'+esc(errMsg(e))+'</div>'; });
    return;
  }
  box.innerHTML = extraHtml(x, false);
}
function extraHtml(x, st){
  var a = x.att || { done:0, total:0, h:0 }, pc = a.total ? Math.round(a.done*100/a.total) : 0, h = '';
  h += sec(t('att_t'), a.total ? pc+'%' : '');
  h += '<div class="list"><div class="nrow"><div class="d">'+t('att_d',{d:a.done,n:a.total,h:a.h})+'<div class="attbar"><i style="width:'+pc+'%"></i></div></div></div>';
  (x.recent || []).slice(0, st ? 4 : 6).forEach(function(r){ h += '<div class="nrow"><div class="d">'+esc(r.t)+'<small>'+dmy(r.d)+(r.h ? ' · '+r.h+' h' : '')+'</small></div></div>'; });
  h += '</div>';
  var ts = x.tests || [];
  h += sec(t('th_t'), ts.length || '');
  h += '<div class="list">'+(ts.length ? ts.slice(0, st ? 6 : 12).map(function(r){
    var ch = (r.ch === '' || r.ch == null || r.ch === 0) ? '' : ' · <span class="'+(r.ch>0?'up':'down')+'">'+(r.ch>0?'▲ +':'▼ ')+r.ch+'</span>';
    return '<div class="nrow"><div class="d">'+esc(r.t)+'<small>'+dmy(r.d)+(r.n > 1 ? ' · '+t('try',{n:r.n}) : '')+ch+'</small></div><span class="why '+(r.ok?'ok':'low')+'">'+r.s+'%'+(r.ok?' ✓':'')+'</span></div>';
  }).join('') : '<div class="empty">'+t('th_none')+'</div>')+'</div>';
  return h;
}
/* v27: vista da mostrare al trainee: solo i suoi risultati, niente "da valutare", niente altri nomi */
function showStudent(){
  var p = personById(CARD), r = stOf(CARD), sk = skillsOfArea(), rated = sk.filter(function(s){ return r[s.code]; });
  var sum = 0, aut = 0; rated.forEach(function(s){ sum += r[s.code][0]; if (r[s.code][0] >= 4) aut++; });
  var x = EXTRA[S.area+'|'+CARD], a = x && x.att, h = '<div class="grab"></div><div class="stv"><h3>'+esc(p.name)+'</h3><div style="color:var(--muted);font-size:.9rem">'+esc(S.area)+' · '+dmy(DATA.today)+'</div>';
  h += '<div class="kpis"><div class="kpi"><b>'+rated.length+'<small>/'+sk.length+'</small></b><span>'+t('k_rated')+'</span></div>'+
    '<div class="kpi"><b>'+(rated.length ? (sum/rated.length).toFixed(1) : '–')+'</b><span>'+t('k_avg')+'</span></div>'+
    '<div class="kpi"><b>'+(rated.length ? Math.round(aut*100/rated.length)+'%' : '–')+'</b><span>'+t('k_aut')+'</span></div>'+
    '<div class="kpi"><b>'+(a && a.total ? Math.round(a.done*100/a.total)+'%' : '–')+'</b><span>'+t('k_att')+'</span></div></div>';
  byMacro(rated).forEach(function(g){
    h += sec(g.name, '') + '<div class="list">'+g.items.map(function(s){
      var v = r[s.code], d = v[2] !== '' ? v[0] - v[2] : 0;
      return '<div class="nrow"><div class="d">'+esc(sDesc(s))+'<small>'+esc(t('lv'+v[0]))+' · '+dmy(v[1])+(d ? ' · <span class="'+(d>0?'up':'down')+'">'+(d>0?'▲ +'+d:'▼ '+d)+'</span>' : '')+'</small></div>'+lvb(v[0])+'</div>';
    }).join('')+'</div>';
  });
  if (x) h += extraHtml(x, true);
  h += '<div class="legend" aria-hidden="true">'+[1,2,3,4,5].map(function(i){ return '<div><i style="background:var(--l'+i+')"></i><b>'+i+'</b> '+t('ls'+i)+'</div>'; }).join('')+'</div>';
  h += '<div class="actions"><button class="btn" type="button" id="stBack">'+t('back')+'</button></div></div>';
  showSheet(h);
  $('stBack').onclick = hideSheet;
}
/* v28: classifiche (più valutati, migliori, peggiori) per trainee o per skill */
var RANK_MIN = 3;
function statsOf(vals){ var n = vals.length, s = 0, u = 0; vals.forEach(function(v){ s += v; if (v >= 4) u++; }); return { n:n, avg: n ? s/n : 0, aut: n ? Math.round(u*100/n) : 0 }; }
function rankHtml(people){
  var sk = skillsOfArea(), h = '', rows;
  var cmp = function(a, b){
    if (OV.o === 'most') return b.st.n - a.st.n || b.st.avg - a.st.avg;
    if (OV.o === 'best') return b.st.avg - a.st.avg || b.st.aut - a.st.aut || b.st.n - a.st.n;
    return a.st.avg - b.st.avg || a.st.aut - b.st.aut || b.st.n - a.st.n;
  };
  var min = OV.o === 'most' ? 1 : RANK_MIN;
  if (OV.by === 'p') {
    rows = people.map(function(p){ var r = stOf(p.id); return { p:p, st: statsOf(sk.filter(function(s){ return r[s.code]; }).map(function(s){ return r[s.code][0]; })) }; })
      .filter(function(x){ return x.st.n >= min; }).sort(cmp);
    h += sec(t('o_'+OV.o), rows.length+'/'+people.length);
    if (OV.o !== 'most') h += '<p class="hint" style="margin:-4px 4px 8px;text-align:left">'+t('o_min',{n:RANK_MIN})+'</p>';
    h += '<div class="list">'+(rows.length ? rows.slice(0, 60).map(function(x, i){
      return '<div class="prow"><span class="chk" style="--av:'+avc(x.p.id)+'">'+(i+1)+'</span>'+
        '<button class="main" type="button" data-card="'+esc(x.p.id)+'"><b>'+esc(x.p.name)+'</b><span style="white-space:normal">'+t('o_sub',{r:x.st.n,n:sk.length,a:x.st.avg.toFixed(1),u:x.st.aut})+'</span></button>'+
        lvb(Math.max(1, Math.min(5, Math.round(x.st.avg))))+'</div>';
    }).join('') : '<div class="empty">'+t('o_none')+'</div>')+'</div>';
  } else {
    var ids = people.map(function(p){ return p.id; });
    rows = sk.map(function(s){ var v = []; ids.forEach(function(id){ var x = stOf(id)[s.code]; if (x) v.push(x[0]); }); return { s:s, st: statsOf(v) }; })
      .filter(function(x){ return x.st.n >= min; }).sort(cmp);
    h += sec(t('o_'+OV.o+'_s'), rows.length+'/'+sk.length);
    if (OV.o !== 'most') h += '<p class="hint" style="margin:-4px 4px 8px;text-align:left">'+t('o_min_s',{n:RANK_MIN})+'</p>';
    h += '<div class="list">'+(rows.length ? rows.map(function(x){
      return '<div class="nrow"><div class="d">'+esc(sDesc(x.s))+'<small>'+t('o_sub_s',{r:x.st.n,a:x.st.avg.toFixed(1),u:x.st.aut})+'</small></div>'+lvb(Math.max(1, Math.min(5, Math.round(x.st.avg))))+'</div>';
    }).join('') : '<div class="empty">'+t('o_none')+'</div>')+'</div>';
  }
  return h;
}
function renderOver(){
  header(t('over_t',{a:S.area}), t('over_d',{d:OLD,l:LOW}), true);
  $('bar').classList.add('hidden');
  if (!AREA[S.area]) { $('app').innerHTML = '<div class="loading">'+t('loading')+'</div>'; loadArea(function(){ if (VIEW === 'over') renderOver(); }); return; }
  var people = DATA.people.filter(function(p){ return p.areas.indexOf(S.area) >= 0; });
  var segBtn = function(k, v, lab){ return '<button type="button" data-'+k+'="'+v+'" aria-pressed="'+(OV[k]===v)+'">'+lab+'</button>'; };
  var sfx = OV.by === 's' ? '_s' : '';
  var h = '<div class="seg">'+segBtn('by','p',t('by_p'))+segBtn('by','s',t('by_s'))+'</div>'+
    '<div class="seg" style="margin-top:8px">'+segBtn('o','need',t('o_need'))+segBtn('o','most',t('o_most'+sfx))+segBtn('o','best',t('o_best'+sfx))+segBtn('o','worst',t('o_worst'+sfx))+'</div>'+
    (OV.o !== 'need' ? '' : '<div class="seg" style="margin-top:8px">'+segBtn('f','all',t('f_all'))+segBtn('f','low',t('f_low'))+segBtn('f','never',t('f_never'))+segBtn('f','old',t('f_old',{d:OLD}))+'</div>');
  var keep = function(x){ return OV.f === 'all' || x.k === OV.f || (OV.f === 'never' && x.k === 'plan' && !x.x); };
  var all = people.map(function(p){ return { p:p, n:needsOf(p.id).filter(keep) }; });
  if (OV.o !== 'need') { h += rankHtml(people); }
  else if (OV.by === 'p') {
    var rows = all.filter(function(x){ return x.n.length; }).map(function(x){ x.c = needCount(x.n); x.w = x.c.plan*3 + x.c.low*3 + x.c.never + x.c.old; return x; })
      .sort(function(a, b){ return b.w - a.w || a.p.name.localeCompare(b.p.name); });
    h += sec(t('f_'+OV.f,{d:OLD}), rows.length+'/'+people.length);
    h += '<div class="list">'+(rows.length ? rows.map(function(x){
      var c = x.c, last = '', r = stOf(x.p.id);
      for (var k in r) if (r[k][1] > last) last = r[k][1];
      var sub = [c.plan?t('r_plan')+' '+c.plan:'', c.low?t('c_low',{n:c.low}):'', c.never?t('c_never',{n:c.never}):'', c.old?t('c_old',{n:c.old,d:OLD}):''].filter(Boolean).join(' · ');
      return '<div class="prow"><span class="chk" style="--av:'+avc(x.p.id)+'">'+esc(ini(x.p.name))+'</span>'+
        '<button class="main" type="button" data-card="'+esc(x.p.id)+'"><b>'+esc(x.p.name)+'</b><span style="white-space:normal">'+sub+'</span></button>'+
        (c.low ? '<span class="tag due" style="background:var(--bad-soft);color:var(--bad)">'+c.low+'</span>' : '')+
        '<span class="tag" style="color:var(--muted)">'+(last ? dm(last) : '–')+'</span></div>';
    }).join('') : '<div class="empty">'+t('nothing')+'</div>')+'</div>';
  } else {
    var bys = skillsOfArea().map(function(s){
      var who = [];
      all.forEach(function(x){ x.n.forEach(function(y){ if (y.s.code === s.code) who.push({ p:x.p, k:y.k, x:y.x }); }); });
      return { s:s, who:who, low:who.filter(function(w){ return w.k === 'low'; }).length };
    }).filter(function(x){ return x.who.length; }).sort(function(a, b){ return b.low - a.low || b.who.length - a.who.length || a.s.mo - b.s.mo; });
    h += sec(t('f_'+OV.f,{d:OLD}), bys.length+'/'+skillsOfArea().length);
    h += '<div class="list">'+(bys.length ? bys.map(function(x){
      var c = needCount(x.who), open = OV.open === x.s.code;
      var sub = [c.plan?t('r_plan')+' '+c.plan:'', c.low?t('c_low',{n:c.low}):'', c.never?t('c_never',{n:c.never}):'', c.old?t('c_old',{n:c.old,d:OLD}):''].filter(Boolean).join(' · ');
      return '<button class="nrow sk" type="button" data-sk="'+esc(x.s.code)+'" aria-expanded="'+open+'"><div class="d">'+esc(sDesc(x.s))+'<small>'+sub+'</small></div><span class="tag" style="color:var(--muted)">'+x.who.length+'/'+people.length+' '+(open?'▴':'▾')+'</span></button>'+
        (open ? '<div class="names">'+x.who.sort(function(a, b){ return (a.k==='low'?0:1) - (b.k==='low'?0:1) || a.p.name.localeCompare(b.p.name); }).map(function(w){
          return '<button type="button" class="'+w.k+'" data-card="'+esc(w.p.id)+'">'+esc(w.p.name)+(w.x ? ' · '+w.x[0] : '')+'</button>';
        }).join('')+'</div>' : '');
    }).join('') : '<div class="empty">'+t('nothing')+'</div>')+'</div>';
  }
  $('app').innerHTML = h;
  each('[data-by]', function(b){ b.onclick = function(){ OV.by = b.dataset.by; OV.open = ''; renderOver(); }; });
  each('[data-f]', function(b){ b.onclick = function(){ OV.f = b.dataset.f; OV.open = ''; renderOver(); }; });
  each('[data-o]', function(b){ b.onclick = function(){ OV.o = b.dataset.o; OV.open = ''; renderOver(); }; });
  each('[data-sk]', function(b){ b.onclick = function(){ OV.open = OV.open === b.dataset.sk ? '' : b.dataset.sk; var y = scrollY; renderOver(); scrollTo(0, y); }; });
  each('[data-card]', function(b){ b.onclick = function(){ openCard(b.dataset.card); }; });
}

each('.lang button', function(b){ b.onclick = function(){ setLang(b.dataset.lang); }; });
window.addEventListener('online', function(){ flushOutbox(); });
setInterval(function(){ flushOutbox(); }, 60000);
if (typeof laReady === 'function') laReady(start); else start();
