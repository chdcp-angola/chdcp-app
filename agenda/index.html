<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#7d1d1a;--brand-soft:#f6eceb;--brand-line:#e8cfcd;--ink:#1b2124;--muted:#65727a;--faint:#93a0a7;--line:#e2e7ea;--bg:#f2f4f5;--card:#fff;
--ok:#11804a;--ok-soft:#e5f4ec;--warn:#a46a00;--warn-soft:#fff4d9;--bad:#b8322f;--bad-soft:#fbe7e5;--info:#235fb8;--info-soft:#eaf2fd;--r:14px;--tap:48px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
.wrap{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.top{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:20}
.top h1{font-size:20px;font-weight:800;line-height:1.2}
.top p{font-size:12.5px;opacity:.85;margin-top:2px}
.top .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lgp{display:inline-flex;flex:none;border:1.5px solid rgba(255,255,255,.55);border-radius:20px;overflow:hidden}
.lgp button{font-size:11px;font-weight:800;color:#fff;padding:5px 8px;background:none;border:0;min-width:30px}
.lgp button.on{background:#fff;color:var(--brand)}
.hright{display:flex;gap:6px;align-items:center;flex:none}
.chipbtn{font-size:11.5px;font-weight:800;border:1.5px solid rgba(255,255,255,.55);border-radius:20px;padding:6px 11px;color:#fff;white-space:nowrap}
.body{padding:14px}
.sec{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--brand);text-transform:uppercase;margin:6px 2px 9px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;text-align:center;background:var(--brand);color:#fff;font-weight:800;font-size:17px;border-radius:14px;padding:16px}
.btn:disabled{opacity:.45}
.link{color:var(--muted);font-size:13.5px;text-decoration:underline;margin-top:14px;display:inline-block}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
/* login */
.search{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px}
.user{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:9px;font-weight:700;font-size:16px;min-height:var(--tap)}
.userfold{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}
.userfold summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:50px;padding:11px 13px;font-weight:800;cursor:pointer}
.userfold summary::-webkit-details-marker{display:none}
.userfold summary:before{content:'›';font-size:22px;color:var(--brand);transition:transform .15s ease}
.userfold[open] summary:before{transform:rotate(90deg)}
.userfold summary .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:800}
.userfold .members{padding:0 9px 9px;border-top:1px solid var(--line);background:#fafbfb}
.userfold .members .user{margin:8px 0 0}
.userrole{font-size:10px;font-weight:800;border-radius:8px;padding:3px 6px;margin-left:auto;background:var(--bg);color:var(--muted)}
.userrole.trainer{background:var(--info-soft);color:var(--info)}
.userrole.admin{background:var(--brand-soft);color:var(--brand)}
.userresults{margin-top:4px}
.pinchange{max-width:440px;margin:18px auto 0}
.pinfield{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:20px;letter-spacing:.18em;text-align:center;background:#fff;margin:8px 0}
.pinhelp{font-size:13px;line-height:1.45;color:var(--muted);margin:8px 0 14px}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.pinbox{text-align:center;padding:22px 14px}
.pinbox h2{font-size:19px;font-weight:800}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.dots span{width:50px;height:58px;border:2px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.dots span.f{border-color:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto 16px}
.pad button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 0;font-size:22px;font-weight:700}
.pad button.x{font-size:15px;color:var(--muted)}
.err{color:var(--bad);font-weight:700;font-size:13.5px;min-height:20px;margin-bottom:8px}
/* filtri */
.pills{display:flex;gap:7px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{white-space:nowrap;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--muted);min-height:36px}
.pills button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pills button.tog.on{background:var(--brand);border-color:var(--brand)}
/* agenda */
.day{margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px}
.day b{font-size:15px;font-weight:800}
.day .today{font-size:10.5px;font-weight:800;background:var(--brand);color:#fff;border-radius:8px;padding:2px 7px;letter-spacing:.04em}
.day .cnt{font-size:12px;color:var(--faint);font-weight:700;margin-left:auto}
.hol{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid #f0d9a3;border-radius:9px;padding:6px 9px;margin:0 0 8px}
.act{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:9px}
.act .tm{width:54px;flex:none;padding-top:13px;text-align:right}
.act .tm b{display:block;font-size:14.5px;font-weight:800}
.act .tm span{font-size:11.5px;color:var(--faint);font-weight:700}
.act .tm i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.03em}
.act .bx{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-left:5px solid var(--tc,var(--faint));border-radius:var(--r);padding:11px 12px}
.act.tent .bx{border-style:dashed;border-left-style:solid;background:#fcfcfd}
.act.done .bx{opacity:.62}
.act.hid .bx{opacity:.5;text-decoration:line-through}
.act .t{font-size:15px;font-weight:700;line-height:1.25}
.act .m{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.act .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.03em;border-radius:7px;padding:3px 7px;background:var(--bg);color:var(--muted)}
.tag.area{background:var(--brand-soft);color:var(--brand)}
.tag.role{background:var(--info-soft);color:var(--info)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.tent{background:#fff;border:1px dashed var(--faint)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.warnbox{background:var(--warn-soft);border:1px solid #f0d9a3;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.foot{font-size:11.5px;color:var(--faint);text-align:center;margin-top:20px}
/* fase 2: navegação, pesquisa e legenda */
.viewtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#e6eaec;border-radius:12px;padding:4px;margin-bottom:10px}
.viewtabs button{min-height:40px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted)}
.viewtabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(27,33,36,.1)}
.navdate{display:grid;grid-template-columns:48px 1fr 48px;gap:7px;align-items:center;margin-bottom:10px}
.navdate button{height:44px;background:#fff;border:1px solid var(--line);border-radius:11px;font-size:20px;font-weight:800}
.navdate .period{text-align:center;font-size:13px;font-weight:800;line-height:1.25}
.navdate .period small{display:block;color:var(--muted);font-weight:600;margin-top:2px}
.navdate .period small button{height:auto;border:0;background:none;font-size:12px;font-weight:700;color:var(--brand);text-decoration:underline;padding:2px 4px}
.srow{display:flex;gap:7px;align-items:stretch}.srow .agsearch{flex:1;min-width:0}
.ftg{flex:none;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:12px;font-weight:800;color:var(--brand);padding:0 11px;white-space:nowrap}.ftg b{display:inline-block;background:var(--brand);color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;margin-left:5px}.ftg.on{background:var(--brand-soft)}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(43px,1fr));gap:4px;margin-bottom:12px;overflow-x:auto}
.wday{background:#fff;border:1px solid var(--line);border-radius:10px;min-width:43px;padding:7px 2px;text-align:center;position:relative}
.wday b{display:block;font-size:12px}.wday span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.wday.today{border-color:var(--brand);color:var(--brand)}
.wday.holiday:after{content:'';position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.tools{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.agsearch{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);margin-bottom:8px}
.selectrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sel{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px 9px;font:inherit;font-size:12.5px;color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.quick button{white-space:nowrap;min-height:36px;padding:7px 10px;border-radius:18px;border:1px solid var(--line);font-size:11.5px;font-weight:800}.quick button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 1px 2px}.legend span{font-size:10.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}.legend i{width:12px;height:12px;border-radius:4px;border:2px solid var(--line);display:inline-block}.legend .lg-tent{border-style:dashed}.legend .lg-done{background:var(--ok-soft);border-color:var(--ok)}.legend .lg-general{background:#f1edfb;border-color:#7560aa}.legend .lg-hidden{background:var(--bad-soft);border-color:var(--bad)}
.tag.general{background:#f1edfb;color:#5b3fa8}
.typeico{margin-right:4px}
.listhead{font-size:12px;color:var(--muted);font-weight:700;margin:4px 2px 10px}
/* semana: alternância calendário / compacta */
.weekswitch{display:flex;align-items:center;gap:10px;margin:10px 0 8px}
.wseg{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;background:#e6eaec;border-radius:12px;padding:4px}
.wseg button{min-height:38px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--muted);padding:0 12px}
.wseg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(27,33,36,.1)}
.wmodehint{font-size:12px;color:var(--muted);font-weight:600}
.weekcompact{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.wcday{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:170px}
.wcday.today{border-color:var(--brand);box-shadow:0 0 0 1px rgba(125,29,26,.08)}
.wcday.holiday{box-shadow:inset 0 -3px 0 var(--warn)}
.wcdayhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.wcdayhead b{font-size:13px;line-height:1.2}
.wcdayhead span{font-size:10.5px;color:var(--muted);font-weight:700;text-align:right}
.wclist{display:flex;flex-direction:column;gap:8px}
.wcrow{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--tc,var(--faint));border-radius:12px;padding:8px 9px}
.wcrow.tent{border-style:dashed;border-left-style:solid;background:#fcfcfd}
.wcrow.done{opacity:.62}.wcrow.hid{opacity:.5;text-decoration:line-through}
.wcrow .topline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.wcrow .time{font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap}
.wcrow .dur{font-size:10.5px;font-weight:700;color:var(--faint);margin-left:6px}
.wcrow .title{font-size:12.5px;font-weight:700;line-height:1.25}
.wcrow .meta{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.wcrow .mini{font-size:10px;font-weight:800;border-radius:999px;padding:3px 6px;background:var(--bg);color:var(--muted)}
.wcrow .mini.area{background:var(--brand-soft);color:var(--brand)}
.wcrow .mini.general{background:#f1edfb;color:#5b3fa8}
.wcempty{font-size:12px;color:var(--muted);padding:8px 2px}
@media (max-width:700px){.weekswitch{flex-direction:column;align-items:flex-start}.weekcompact{grid-template-columns:repeat(5,minmax(220px,1fr));}}

/* calendario settimanale: 5 giorni lavorativi + fascia Sem hora */
.wrap.weekwide{max-width:1180px}
.weekcal-scroll{overflow-x:auto;margin:10px -2px 14px;padding:0 2px 6px;scrollbar-width:thin}
.weekcal{min-width:790px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(27,33,36,.03)}
.wc-head,.wc-notime,.wc-body{display:grid;grid-template-columns:58px repeat(5,minmax(142px,1fr))}
.wc-head{border-bottom:1px solid var(--line);background:#fafbfb}
.wc-corner{border-right:1px solid var(--line)}
.wc-dayhead{padding:9px 8px;text-align:center;border-right:1px solid var(--line);min-height:56px}
.wc-dayhead:last-child{border-right:0}
.wc-dayhead b{font-size:12px;font-weight:800;display:block}
.wc-dayhead span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-dayhead.today{background:var(--brand-soft);color:var(--brand)}
.wc-dayhead.holiday{box-shadow:inset 0 -3px 0 var(--warn)}
.wc-notime{border-bottom:1px solid var(--line);background:#fcfcfd}
.wc-notime-lab{font-size:9.5px;font-weight:800;color:var(--faint);padding:9px 4px;text-align:center;border-right:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em}
.wc-notime-cell{padding:5px;border-right:1px solid var(--line);min-height:42px}
.wc-notime-cell:last-child{border-right:0}
.wc-note{display:block;width:100%;text-align:left;border-left:4px solid var(--tc,var(--faint));background:#fff;border-radius:7px;padding:5px 6px;margin-bottom:4px;font-size:9.5px;font-weight:700;line-height:1.2;overflow:hidden}
.wc-note:last-child{margin-bottom:0}
.wc-times{position:relative;border-right:1px solid var(--line);background:#fafbfb}
.wc-time{position:absolute;left:0;right:0;transform:translateY(-50%);font-size:9.5px;font-weight:700;color:var(--faint);text-align:center}
.wc-lane{position:relative;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#edf0f2 31px,#edf0f2 32px,transparent 32px,transparent 63px,#dfe4e7 63px,#dfe4e7 64px)}
.wc-lane:last-child{border-right:0}
.wc-lane.today{background-color:#fffdfd}
.wcevent{position:absolute;text-align:left;background:#fff;border:1px solid #dfe4e7;border-left:4px solid var(--tc,var(--faint));border-radius:8px;padding:5px 6px;overflow:hidden;box-shadow:0 1px 2px rgba(27,33,36,.08);z-index:2}
.wcevent:hover{z-index:5;box-shadow:0 3px 10px rgba(27,33,36,.14)}
.wcevent.tent{border-style:dashed;border-left-style:solid}
.wcevent.done{opacity:.6}
.wcevent.hid{text-decoration:line-through;opacity:.5}
.wcevent .wct{font-size:9.5px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcevent .wcn{font-size:10.5px;font-weight:700;line-height:1.18;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcevent .wca{font-size:9px;font-weight:800;color:var(--brand);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weekend{margin-top:14px}
.weekend .sec{margin-top:10px}
.weekhelp{font-size:10.5px;color:var(--faint);margin:-3px 2px 8px}
@media(max-width:700px){.wrap.weekwide{max-width:760px}.weekcal{min-width:760px}.weekcal-scroll{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}.wcevent .wcn{-webkit-line-clamp:3}}
/* scheda */
.sheet{position:fixed;inset:0;background:rgba(27,33,36,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:18px;font-weight:800;line-height:1.25;margin:6px 0 12px}
.ro{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.ro span{color:var(--muted)} .ro b{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:60;max-width:90%}
.loading{position:fixed;inset:0;background:rgba(242,244,245,.7);display:flex;align-items:center;justify-content:center;z-index:70;font-weight:700;color:var(--brand)}
.sync{font-size:12.5px;padding:7px 11px;border-radius:9px;margin:0 0 10px;background:#eaf4ee;color:#1f5a3a}
.sync.busy{background:#eef2fb;color:#2a4a8a}.sync.off{background:#fdecea;color:#8a1f17}.sync .link{margin:0 0 0 8px;font-size:12.5px;color:inherit}
.outwin{font-size:13px;color:var(--muted);background:#fff7e6;border:1px solid #f0dcb0;border-radius:9px;padding:8px 11px;margin:0 0 10px}

/* === ECOSSISTEMA v0.6 (CSS) === */
/* ===== CHDCP Agenda v0.6 · ecossistema ===== */
.beta{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;background:#fff;color:var(--brand);border-radius:6px;padding:2px 6px;vertical-align:middle;margin-left:4px}
.tag.act{background:#fff4d9;color:#8a5a00}
.page{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page .wrap{padding-bottom:110px}
.top .back{font-size:24px;font-weight:800;color:#fff;width:40px;height:40px;margin:-6px 4px -6px -8px;flex:none}
.top .bar.withback{justify-content:flex-start}
.top .bar.withback>div{flex:1;min-width:0}
.top .bar.withback h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead h2{font-size:19px;font-weight:800;line-height:1.25;margin:2px 0 6px}
.dhead .id{font-size:11.5px;color:var(--faint);font-weight:700;letter-spacing:.02em}
.dhead .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.acts{display:flex;flex-direction:column;gap:9px}
.abtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--brand-line);border-radius:var(--r);padding:13px 14px;min-height:60px}
.abtn .ic{font-size:22px;width:30px;text-align:center;flex:none}
.abtn b{display:block;font-size:15.5px;font-weight:800;color:var(--brand)}
.abtn small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.abtn .go{margin-left:auto;font-size:22px;color:var(--brand);font-weight:800}
.abtn:disabled{opacity:.5;border-color:var(--line)}
.abtn .done{color:var(--ok);font-weight:800}
.noact{font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px}
.ctx{font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
.ctx b{color:var(--ink)}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.counters div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.counters b{display:block;font-size:20px;font-weight:800}
.counters span{font-size:11px;color:var(--muted);font-weight:700}
.counters .p b{color:var(--ok)} .counters .a b{color:var(--bad)}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:7px;min-height:56px}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.prow .nm span{font-size:11.5px;color:var(--muted)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:10px;padding:3px;flex:none}
.seg2 button{min-width:52px;min-height:40px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted)}
.seg2 button.onP{background:var(--ok);color:#fff}
.seg2 button.onA{background:var(--bad);color:#fff}
.score{width:74px;border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;font-size:17px;font-weight:700;flex:none}
.pct{width:56px;text-align:right;font-size:12px;font-weight:800;flex:none}
.pct.ok{color:var(--ok)} .pct.ko{color:var(--bad)}
.field{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:8px 2px 4px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(242,244,245,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:45}
.savebar .in{max-width:760px;margin:0 auto}
.savebar .btn{padding:14px}
.minor{display:inline-block;font-size:12.5px;font-weight:800;color:var(--brand);border:1.5px solid var(--brand-line);border-radius:18px;padding:8px 12px;margin:0 6px 10px 0;background:#fff}
.pushcard{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--brand-line);border-radius:14px;padding:11px 12px;margin-bottom:12px}.pushcard .ic{font-size:24px}.pushcard .tx{flex:1;min-width:0}.pushcard b{display:block;color:var(--brand);font-size:14.5px}.pushcard small{display:block;font-size:12px;color:var(--muted)}.pbtn{flex:none;background:var(--brand);color:#fff;font-weight:800;font-size:13px;border-radius:10px;padding:9px 13px}
.addpanel{border:1.5px solid var(--brand-line);border-radius:12px;background:#fff;padding:10px;margin:0 0 12px}
.addhead{display:flex;gap:8px;align-items:center}.addhead .inp{flex:1}.addhead .minor{margin:0;flex:none}
.addlist{max-height:46vh;overflow:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.addlist .user{margin-bottom:6px}.addnote{margin:2px 2px 8px}
.addplus{flex:none;font-size:20px;font-weight:800;color:var(--brand);padding:0 4px}
.pending{font-size:12.5px;padding:7px 11px;border-radius:9px;margin:0 0 10px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.pending button{color:inherit;text-decoration:underline;font-weight:800;margin-left:6px}
.mg{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}
.mg summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 13px;font-weight:800;font-size:14px;cursor:pointer}
.mg summary::-webkit-details-marker{display:none}
.mg summary .cnt{margin-left:auto;font-size:11.5px;color:var(--muted)}
.mg .sub{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;padding:8px 13px 2px}
.sk{padding:9px 13px;border-top:1px solid var(--line)}
.sk .d{font-size:13.5px;line-height:1.35}
.sk .d small{display:block;font-size:11px;color:var(--faint);margin-top:2px}
.sk .d .plan{color:var(--info);font-weight:800}
.lv{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}
.lv button{min-height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--muted)}
.lv button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.lvhelp{font-size:11px;color:var(--muted);line-height:1.5;margin:0 2px 10px}
.modebox{display:flex;align-items:center;gap:10px;background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;font-weight:700}
.modebox button{margin-left:auto;font-size:12px;font-weight:800;text-decoration:underline;color:inherit}
.sent{font-size:11px;font-weight:800;color:var(--ok)}
.evalbox{text-align:center;padding:20px 14px}
.evalbox h2{font-size:18px;margin:6px 0 8px}
.evalbox .btn{margin-top:12px}
.evalbox .sbtn{display:block;width:100%;margin-top:10px;border:1.5px solid var(--brand-line);border-radius:14px;padding:13px;font-weight:800;color:var(--brand);background:#fff}
.readonly{background:var(--warn-soft);border:1px solid #f0d9a3;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-bottom:10px}
/* menu inicial */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 13px;min-height:112px;box-shadow:0 1px 2px rgba(27,33,36,.04)}
.tile .ic{font-size:26px;margin-bottom:4px}
.tile b{font-size:15.5px;font-weight:800;color:var(--brand);line-height:1.2}
.tile small{font-size:11.5px;color:var(--muted);line-height:1.35}
.tile:active{background:var(--brand-soft)}
.hrow{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--tc,var(--faint));border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.hrow .t{font-size:14.5px;font-weight:700;line-height:1.25}
.hrow .m{font-size:12px;color:var(--muted);margin-top:3px}
.hrow.later{opacity:.55}

/* ===== adaptive: telefone (base) · tablet ≥ 700px · computador ≥ 1024px ===== */
.hsec{margin-top:16px}
@media (min-width:700px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .plist{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
  .sks{display:grid;grid-template-columns:1fr 1fr}
  .sks .sk:nth-child(2n){border-left:1px solid var(--line)}
  .counters{max-width:520px}
  .evalbox{max-width:520px;margin:0 auto}
}
@media (min-width:1024px){
  .wrap.homewide,.page .wrap{max-width:1180px}
  .hgrid{display:grid;grid-template-columns:3fr 2fr;gap:22px;align-items:start}
  .hsec{margin-top:6px}
  .dgrid{display:grid;grid-template-columns:3fr 2fr;gap:20px;align-items:start}
  .dside{position:sticky;top:96px}
  .plist{grid-template-columns:repeat(3,1fr)}
  .savebar .in{max-width:1180px;display:flex;justify-content:flex-end}
  .savebar .btn{width:auto;min-width:320px;padding:14px 28px}
}
@media (hover:hover) and (pointer:fine){
  .tile:hover,.abtn:hover,.hrow:hover,.prow:hover,.user:hover{border-color:var(--brand-line);box-shadow:0 2px 8px rgba(27,33,36,.08)}
}

/* v0.6 · ficha: plano, participantes, resultados */
.plan .pl{font-size:13px;line-height:1.45;padding:7px 0;border-bottom:1px solid var(--line)}
.plan .pl:last-child{border-bottom:0}
.plan .pl span{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.plan .sk1{font-size:12.5px;padding:2px 0}
.plan summary,.card>summary{cursor:pointer;list-style:none}
.card>summary::-webkit-details-marker{display:none}
.prof{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.prof:last-child{border-bottom:0}
.prof .av{width:32px;height:32px;font-size:12px}
.prof small{font-size:10px;color:var(--muted);font-weight:800}
.prof .go{margin-left:auto}
.abtn.sec2{border-color:var(--line)}
.abtn.sec2 b{color:var(--ink)}

/* v0.9 · navegação: Início em todos os ecrãs, anterior/seguinte, passo seguinte */
.top .hm{display:inline-flex;align-items:center;gap:5px;flex:none;color:#fff;font-size:12px;font-weight:800;border:1.5px solid rgba(255,255,255,.55);border-radius:20px;padding:6px 10px 6px 8px;margin-left:8px}
.top .hm svg,.chipbtn svg{width:17px;height:17px;flex:none}
.chipbtn.hmc{display:inline-flex;align-items:center;gap:5px}
@media (max-width:380px){.top .hm span{display:none}.top .hm{padding:6px 8px}}
.page.anim{animation:pgin .16s ease-out}
html,body{overflow-x:hidden}
.tags .tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pgin{from{opacity:.4;transform:translateX(22px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.anim{animation:none}}
.pn{display:flex;gap:8px;margin:14px 0 4px}
.pn button{flex:1;min-width:0;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pn button.nx{text-align:right;align-items:flex-end}
.pn button:disabled{opacity:.35}
.pn b{font-size:12.5px;color:var(--brand);font-weight:800}
.pn small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.done{text-align:center;padding:22px 16px}
.done .ok{font-size:44px;line-height:1}
.done h2{font-size:19px;margin:8px 0 4px}
.nextsec{margin-top:16px}
.navrow{display:flex;gap:8px;margin-top:12px}
.navrow .sbtn{flex:1;margin:0;background:#fff;border:1.5px solid var(--brand-line,#e8cfcd);border-radius:14px;padding:12px 8px;font-weight:800;color:var(--brand);text-align:center}
.kbd{display:none}
@media (hover:hover) and (min-width:900px){.kbd{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:10px}}

<script>
/* ============================================================
   CHDCP – Activity Planning · cliente (vanilla JS) · v0.5.0 → v0.6.0 (blocco ECOSSISTEMA in fondo)
   v0.5: un solo pacchetto (apiAgendaAll) salvato sul telefono; vista,
   date, filtri e ricerca locali; aggiornamento in background con barra
   "Actualizado / A actualizar / Sem ligação"; tasto Indietro sulla ficha.
   Nel browser restano solo: ultimo utente (ID + nome), utenti
   recenti, filtri e il gettone di sessione (validato dal server).
   Dentro la PWA lo stato vive nel guscio (bridge postMessage).

var PWA = "" === '1';
var PWA_ORIGIN = "";
var APP_NAME = "CHDCP Agenda";

var S = { token: null, user: null, data: null, view: 'WEEK', anchor: '', mine: false, hidden: false, area: '', method: '', search: '', searchTimer: null };
var MEM = {};
var BRIDGED = false;

var LS = {
  get: function (k) {
    if (BRIDGED) return MEM[k] === undefined ? null : MEM[k];
    try { return JSON.parse(localStorage.getItem('ap_' + k)); } catch (e) { return null; }
  },
  set: function (k, v) {
    MEM[k] = v;
    try { localStorage.setItem('ap_' + k, JSON.stringify(v)); } catch (e) {}
    if (BRIDGED) post({ type: 'save', key: k, value: v });
  },
  del: function (k) {
    delete MEM[k];
    try { localStorage.removeItem('ap_' + k); } catch (e) {}
    if (BRIDGED) post({ type: 'save', key: k, value: null });
  }
};

function post(msg) {
  if (!PWA || !PWA_ORIGIN) return;
  msg.ns = 'chdcp-ap';
  try { window.top.postMessage(msg, PWA_ORIGIN); } catch (e) {}
}

/* link esterni (calendario, .ics): nella PWA li apre il guscio */
function openExt(url) {
  if (BRIDGED) post({ type: 'open', url: url }); else window.open(url, '_blank');
}

var DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

if (I18N.lang() === 'EN') {
  DIAS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; DIAS_L = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  MESES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
} else if (I18N.lang() === 'IT') {
  DIAS = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab']; DIAS_L = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
  MESES = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function ymd(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function addDays(s, n) { var d = ymd(s); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function ini(n) { return String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase(); }
function avc(id) { var c = ['#256abf', '#11804a', '#7d1d1a', '#8a5a00', '#5b3fa8', '#1d7a8a']; var h = 0; String(id).split('').forEach(function (x) { h = (h * 31 + x.charCodeAt(0)) % 997; }); return c[h % c.length]; }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
      var msg = (e && e.message) || String(e);
      if (msg.indexOf('SESSION:') >= 0) { S.token = null; LS.del('tok'); showPin(LS.get('last'), msg.replace(/^.*SESSION:\s*/, '')); }
      ko(new Error(msg.replace(/^.*SESSION:\s*/, '')));

  });
}

/* ---------------- ARRANQUE (bridge com o invólucro PWA) ---------------- */

function boot() {
  I18N.start();
  if (!PWA || !PWA_ORIGIN) { start(); return; }
  var done = false;
  window.addEventListener('message', function (e) {
    if (e.origin !== PWA_ORIGIN || !e.data || e.data.ns !== 'chdcp-ap') return;
    if (e.data.type === 'state' && !done) {
      done = true; BRIDGED = true; MEM = e.data.state || {};
      start();
    }
  });
  post({ type: 'ready' });
  setTimeout(function () { if (!done) { done = true; start(); } }, 1500);
}

function start() {
  var f = LS.get('f');
  if (f) { S.view = f.view || S.view; S.anchor = f.anchor || ''; S.mine = !!f.mine; S.hidden = !!f.hidden; S.area = f.area || ''; S.method = f.method || ''; S.search = f.search || ''; S.weekMode = f.weekMode || ''; }

  var last = LS.get('last');
  if (tok && last) {

    var cached = loadData();
    if (cached && cached.uid === last.id) {
      setData(cached.r); S.user = ALL.user; SYNC.state = 'busy'; loadAgenda(); sync(false); resumeFromLa();
    } else {
      sync(true);

    showPin(last);

    showUsers();

}

var ALL = null;                 /* pacote autorizado devolvido por apiAgendaAll */
var SYNC = { state: '' };       /* '' | 'busy' | 'off' */
var SYNCING = false;
var DKEY = 'ap_data_v1';

function norm(v) { return String(v == null ? '' : v).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' '); }
function hm(ms) { return ms ? new Date(ms).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }) : ''; }
function loadData() { try { return JSON.parse(localStorage.getItem(DKEY)); } catch (e) { return null; } }
function saveData(r) { try { localStorage.setItem(DKEY, JSON.stringify({ uid: r.user.id, r: r })); } catch (e) {} }
function dropData() { try { localStorage.removeItem(DKEY); localStorage.removeItem(CXKEY); } catch (e) {} CXM = null; }

/* v0.8 · fichas e listas de presenças guardadas no telefone (3 dias, máx. 60):
   abrem logo, mesmo com rede fraca; o servidor actualiza-as em segundo plano */
var CXKEY = 'ap_cx_v1', CXM = null;
function cxAll() { if (!CXM) { try { CXM = JSON.parse(localStorage.getItem(CXKEY)) || {}; } catch (e) { CXM = {}; } } return CXM; }
function cxGet(k) { var x = cxAll()[k]; return x && Date.now() - x.t < 3 * 86400000 ? x.v : null; }
function cxSave() { try { localStorage.setItem(CXKEY, JSON.stringify(CXM || {})); } catch (e) { CXM = {}; try { localStorage.removeItem(CXKEY); } catch (x) {} } }
function cxSet(k, v, noSave) {
  var o = cxAll(); o[k] = { t: Date.now(), v: v };
  var ks = Object.keys(o);
  if (ks.length > 60) ks.sort(function (a, b) { return o[a].t - o[b].t; }).slice(0, ks.length - 60).forEach(function (x) { delete o[x]; });
  if (!noSave) cxSave();
}
function cxDel(k) { var o = cxAll(); if (o[k]) { delete o[k]; cxSave(); } }

/* espande o pacote compacto (tipos por índice, campos vazios omitidos) */
function setData(r) {
  var types = r.types || [];
  var acts = (r.acts || []).map(function (x) {
    var a = {}; for (var k in x) a[k] = x[k];
    var t = types[a.ty] || {};
    a.typeLabel = t.label || ''; a.typeColor = t.color || ''; a.typeIcon = t.icon || '';
    a.trainers = a.trainers || [];
    ['start', 'end', 'area', 'title', 'method', 'platform', 'governance', 'governanceType', 'place', 'translator', 'exec', 'status', 'role'].forEach(function (k) { if (a[k] == null) a[k] = ''; });
    return a;
  });
  /* v0.8: fichas e presenças de hoje e ontem já vieram no pacote */
  if (r.pre) {
    Object.keys(r.pre.det || {}).forEach(function (id) { ST[id] = r.pre.det[id]; cxSet('det|' + id, r.pre.det[id], true); });
    Object.keys(r.pre.att || {}).forEach(function (id) { cxSet('att|' + id, r.pre.att[id], true); });
    cxSave();
    delete r.pre;
  }
  ALL = { user: r.user, areas: r.areas || [], acts: acts, holidays: r.holidays || [], from: r.from, to: r.to, readAt: r.readAt, today: r.today, warnings: r.warnings || [], syncedAt: r.syncedAt || 0 };
  var real = todayYmd(); if (real > ALL.today) ALL.today = real;
}
function todayYmd() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

/* chamada com tempo máximo: na rede fraca não fica à espera para sempre */
function callT(ms, fn) {
  var args = Array.prototype.slice.call(arguments, 2);
  return new Promise(function (ok, ko) {
    var done = false;
    var tm = setTimeout(function () { if (!done) { done = true; ko(new Error('TIMEOUT')); } }, ms);
    call.apply(null, [fn].concat(args)).then(function (r) { if (!done) { done = true; clearTimeout(tm); ok(r); } }, function (e) { if (!done) { done = true; clearTimeout(tm); ko(e); } });
  });
}

function onAgenda() { return !!$('syncw'); }

function sync(first) {
  if (!S.token || SYNCING) return;
  SYNCING = true; SYNC.state = 'busy'; paintSync();
  if (first && !ALL) busy(true);
  callT(30000, 'apiAgendaAll', S.token).then(function (r) {
    SYNCING = false; busy(false);
    if (!r || r.session === false) { S.token = null; LS.del('tok'); dropData(); ALL = null; showPin(LS.get('last'), 'A sessão expirou. Introduza o PIN.'); return; }
    r.syncedAt = Date.now(); setData(r); saveData(r); S.user = r.user; SYNC.state = '';
    if (r.mustChangePin) { showChangePin(); return; }
    loadAgenda();
  }).catch(function () {
    SYNCING = false; busy(false); SYNC.state = 'off';
    if (ALL) { if (onAgenda()) paintSync(); else loadAgenda(); return; }
    $('app').innerHTML = head() + '<div class="body"><div class="card" style="text-align:center"><h2 style="font-size:18px">Sem ligação ao servidor</h2><p class="muted small" style="margin:8px 0 14px">Verifique a internet e tente de novo.</p><button class="btn" id="retry0">Tentar de novo</button><button class="link" id="other0">Outro utilizador</button></div></div>';
    $('retry0').onclick = function () { sync(true); };
    $('other0').onclick = function () { logout(); };
  });
}

  if (SYNC.state === 'busy') return '<div class="sync busy">A actualizar…' + (t ? ' · dados de ' + t : '') + '</div>';
  if (SYNC.state === 'off') return '<div class="sync off">Sem ligação — dados de ' + (t || '?') + '<button class="link" id="retry">Tentar de novo</button></div>';

/* filtra localmente o pacote: mesma lógica que o servidor usava em apiAgenda */
function buildView() {
  var A = ALL, today = A.today;
  var anchor = /^\d{4}-\d{2}-\d{2}$/.test(S.anchor || '') ? S.anchor : today;
  var from = '', to = '';
  if (S.view === 'TODAY') { from = anchor; to = anchor; }
  else if (S.view === 'WEEK') { from = addDays(anchor, -((ymd(anchor).getDay() + 6) % 7)); to = addDays(from, 6); }
  var af = norm(S.area), mf = norm(S.method), q = norm(S.search);
  var fa = {}, fm = {}, list = [];
  A.acts.forEach(function (a) {
    if (a.hidden && !S.hidden) return;
    if (a.area) fa[a.area] = true;
    if (a.method) fm[a.method] = true;
    if (S.mine && !a.role) return;
    if (from && a.date < from) return;
    if (to && a.date > to) return;
    if (af && norm(a.area) !== af && norm(a.area) !== 'all') return;
    if (mf && norm(a.method) !== mf) return;
    if (q) {
      if (!a._hay) a._hay = norm([a.title, a.full, a.area, a.method, a.platform, a.place, a.status, a.exec].concat(a.trainers).join(' '));
      if (a._hay.indexOf(q) < 0) return;
    }
    list.push(a);
  });
  return {
    user: A.user, areas: A.areas, list: list,
    facets: { areas: Object.keys(fa).sort(), methods: Object.keys(fm).sort() },
    holidays: A.holidays.filter(function (x) { return (!from || x.date >= from) && (!to || x.date <= to); }),
    viewFrom: from || A.from, viewTo: to || A.to, anchor: anchor, from: A.from, to: A.to,
    outside: !!(from && (to < A.from || from > A.to)),
    readAt: A.readAt, warnings: A.warnings, today: today

}

/* era uma chamada ao servidor: agora é só local */

  S.data = d; S.user = d.user; S.anchor = d.anchor; saveF(); renderAgenda();

function fmtDate(s, long) {

function holidayOn(date) {

function timeMin(s) {
  var m = String(s || '').match(/^(\d{1,2})[:.](\d{2})$/);
  if (!m) return null;
  var h = +m[1], n = +m[2];
  return h >= 0 && h < 24 && n >= 0 && n < 60 ? h * 60 + n : null;

function layoutWeekDay(items) {
  items.sort(function (x, y) { return x.sm - y.sm || x.em - y.em; });
  var active = [], maxCols = 1;
  items.forEach(function (x) {
    active = active.filter(function (a) { return a.em > x.sm; });
    var used = {}; active.forEach(function (a) { used[a.slot] = true; });
    var slot = 0; while (used[slot]) slot++;
    x.slot = slot; active.push(x); maxCols = Math.max(maxCols, active.length, slot + 1);
  });
  items.forEach(function (x) { x.cols = maxCols; });
  return items;
}

function renderWeekCompact(d, list) {

  });
  Object.keys(dayMap).forEach(function (k) { dayMap[k].sort(function (x, y) { return x.sm - y.sm || String(x.a.title).localeCompare(String(y.a.title)); }); });

function renderWeekCalendar(d, list) {
  var days = [], i;
  for (i = 0; i < 5; i++) days.push(addDays(d.viewFrom, i));
  var dayMap = {}, noTime = {}, timedAll = [], weekend = [];
  days.forEach(function (ds) { dayMap[ds] = []; noTime[ds] = []; });

  list.forEach(function (a, idx) {
    if (days.indexOf(a.date) < 0) {
      if (a.date === addDays(d.viewFrom, 5) || a.date === addDays(d.viewFrom, 6)) weekend.push({ a: a, i: idx });
      return;
    }
    if (a.noTime || a.async) { noTime[a.date].push({ a: a, i: idx }); return; }
    var sm = timeMin(a.start), em = timeMin(a.end);
    if (sm == null) { noTime[a.date].push({ a: a, i: idx }); return; }
    if (em == null || em <= sm) em = sm + 60;
    var x = { a: a, i: idx, sm: sm, em: em };
    dayMap[a.date].push(x); timedAll.push(x);
  });

  var minM = 8 * 60, maxM = 18 * 60;
  timedAll.forEach(function (x) { minM = Math.min(minM, x.sm); maxM = Math.max(maxM, x.em); });
  minM = Math.max(6 * 60, Math.floor(minM / 60) * 60);
  maxM = Math.min(22 * 60, Math.ceil(maxM / 60) * 60);
  if (maxM <= minM) maxM = minM + 10 * 60;
  var ppm = 64 / 60, height = Math.round((maxM - minM) * ppm);

  var h = '<div class="weekhelp">Deslize horizontalmente no telemóvel para ver os cinco dias.</div><div class="weekcal-scroll"><div class="weekcal">';
  h += '<div class="wc-head"><div class="wc-corner"></div>';
  days.forEach(function (ds) {
    var dt = ymd(ds), hol = holidayOn(ds), cnt = (dayMap[ds] || []).length + (noTime[ds] || []).length;
    h += '<div class="wc-dayhead' + (ds === d.today ? ' today' : '') + (hol ? ' holiday' : '') + '"><b>' + DIAS_L[dt.getDay()] + ' ' + dt.getDate() + '</b><span>' + (hol ? esc(hol.name) : (cnt + (cnt === 1 ? ' actividade' : ' actividades'))) + '</span></div>';
  });
  h += '</div>';

/* v0.8 · mostra logo a cópia do telefone (se houver) e actualiza em segundo plano;
   se a pessoa já começou a marcar, a cópia nova fica para a próxima abertura */
function withCtx(key, fn, a, title, draw) {
  if (DR[key]) { draw(DR[key]); return; }
  var me, old = cxGet(key);
  if (old) { DR[key] = { ctx: old, cid: uid(), stale: true }; draw(DR[key]); me = here(); }
  else { loadingPage(title, a.title); me = here(); }
  callT(30000, fn, S.token, a.id).then(function (ctx) {
    cxSet(key, ctx);
    var d = DR[key];
    if (d && d.touched) return;
    if (d && old && JSON.stringify(old) === JSON.stringify(ctx)) { d.stale = false; return; }
    DR[key] = { ctx: ctx, cid: d ? d.cid : uid() };
    if (here() === me) draw(DR[key]);
  }).catch(function (e) {
    if (old) { if (DR[key]) DR[key].stale = false; return; } /* fica a cópia do telefone */
    if (here() === me) errorPage(title, a.title, e.message, function () { withCtx(key, fn, a, title, draw); });
  });
}

      if (!$('addr')) return;
      var q = norm(d.addQ || ''), all = (d.plist || []).filter(function (p) { return !inRoster(p.id); });
      var shown, note = '';
      if (q) {
        shown = all.filter(function (p) { if (!p._h) p._h = norm(p.name + ' ' + p.id + ' ' + (p.areas || []).join(' ')); return p._h.indexOf(q) >= 0; });
        note = shown.length + ' encontrado(s)';
      } else {
        var same = all.filter(function (p) { return p.same; });
        shown = same.length ? same : all;
        note = same.length ? 'Pessoas da área ' + (d.parea || '') + ' · escreva para procurar entre todas (' + all.length + ')' : 'Todas as pessoas (' + all.length + ')';
      }
      var more = shown.length > 80 ? shown.length - 80 : 0;
      $('addr').innerHTML = '<div class="small muted addnote">' + esc(note) + '</div>' +
        (shown.length ? shown.slice(0, 80).map(row).join('') : '<div class="small muted">Ninguém encontrado.</div>') +
        (more ? '<div class="small muted addnote">+ ' + more + ' · escreva mais letras para ver</div>' : '');
      bindRows();
    };
    /* servidor antigo (sem lista): procura no servidor como antes */
    var legacy = function () {
      var tm = null;
      var run = function () {
        var q = (d.addQ || '').trim();
        if (q.length < 2) { $('addr').innerHTML = '<div class="small muted">Escreva pelo menos 2 letras.</div>'; return; }
        $('addr').innerHTML = '<div class="small muted">A procurar…</div>';
        call('apiPeopleSearch', S.token, a.id, q).then(function (res) {
          if (!$('addr')) return;
          $('addr').innerHTML = res.length ? res.filter(function (p) { return !inRoster(p.id); }).map(row).join('') : '<div class="small muted">Ninguém encontrado.</div>';
          bindRows();
        }).catch(function (e) { if ($('addr')) $('addr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
      };
      $('addq').oninput = function () { d.addQ = this.value; clearTimeout(tm); tm = setTimeout(run, 350); };
      run();
    };
    $('addq').oninput = function () { d.addQ = this.value; draw(); };
    setTimeout(function () { try { $('addq').focus(); } catch (e) {} }, 30);
    if (d.plist) { draw(); return; }
    var c0 = peopleCached();
    if (c0) { setPlist(d, c0, a); draw(); }
    loadPeople(a).then(function (pl) { setPlist(d, pl, a); draw(); }).catch(function (e) {
      if (!$('addr') || d.plist) return;
      if (/não permitida|inexistente|is not a function|not defined|Script function not found/i.test(e.message)) { legacy(); return; }
      $('addr').innerHTML = '<div class="err">' + esc(isNet(e.message) ? 'Sem ligação: tente quando houver rede.' : e.message) + '</div><button class="minor" id="addre">Tentar de novo</button>';
      $('addre').onclick = function () { d.addOpen = false; open(); };
    });
  };
  btn.onclick = open;
  if (d.addOpen) open();
}

/* ---------------- REGISTAR PRESENÇAS ---------------- */

function screenAttendance(a) {
  withCtx('att|' + a.id, 'apiAttendanceContext', a, 'Presenças', function (d) {
    if (!d.mark) d.mark = Object.assign({}, d.ctx.saved || {});
    drawAttendance(a, d);
  });
}

function drawAttendance(a, d) {
  var c = d.ctx, ro = !c.canWrite.ok;
  var srcTxt = { GOVERNANCE: 'membro do grupo', AGENDA_ASSIGNMENT: '', PERSON_TRAINING_AREA: '', OVERRIDE: 'adicionado no plano', ADD: 'adicionado', SAVED: 'registado antes' };
  var h = bhead('Presenças', c.act.title) + '<div class="body">' + ctxBox(c.act);
  if (ro) h += '<div class="readonly">' + esc(c.canWrite.why) + '</div>';
  if (c.savedAt) h += '<div class="sync">Já registadas · ' + esc(tsTxt(c.savedAt)) + (c.savedBy ? ' · ' + esc(c.savedBy) : '') + '. Pode corrigir e guardar de novo.</div>';
  h += '<div class="counters"><div class="p"><b id="cP">0</b><span>Presentes</span></div><div class="a"><b id="cA">0</b><span>Ausentes</span></div><div><b id="cN">0</b><span>Por marcar</span></div></div>';
  if (!ro) h += '<button class="minor" id="allp">Todos presentes</button><button class="minor" id="addp">+ Adicionar participante</button><div id="addbox"></div>';
  if (!c.people.length) h += '<div class="empty">Sem lista prevista para esta actividade. Use «Adicionar participante».</div>';
  h += '<div class="plist">' + c.people.map(function (p) {
    var st = d.mark[p.id] || '';
    return '<div class="prow"><div class="nm"><b>' + esc(p.name) + '</b><span>' + esc([p.r && p.r !== 'TRAINEE' ? p.r : '', srcTxt[p.src] || ''].filter(Boolean).join(' · ')) + '</span></div>' +
      '<div class="seg2"><button data-p="' + esc(p.id) + '" data-s="PRESENT" class="' + (st === 'PRESENT' ? 'onP' : '') + '"' + (ro ? ' disabled' : '') + '>Presente</button>' +
      '<button data-p="' + esc(p.id) + '" data-s="ABSENT" class="' + (st === 'ABSENT' ? 'onA' : '') + '"' + (ro ? ' disabled' : '') + '>Ausente</button></div></div>';
  }).join('') + '</div></div>';
  if (!ro) h += '<div class="savebar"><div class="in"><button class="btn" id="save">Guardar presenças</button></div></div>';
  page(h);

  var paint = function () {
    var P = 0, A = 0;
    c.people.forEach(function (p) { if (d.mark[p.id] === 'PRESENT') P++; else if (d.mark[p.id] === 'ABSENT') A++; });
    $('cP').textContent = P; $('cA').textContent = A; $('cN').textContent = c.people.length - P - A;
    if ($('save')) { $('save').disabled = !(P + A); $('save').textContent = 'Guardar presenças (' + (P + A) + ')'; }
  };
  Array.prototype.forEach.call(document.querySelectorAll('.seg2 button'), function (b) {
    b.onclick = function () {
      var pid = b.dataset.p, s = b.dataset.s;
      d.touched = true;
      d.mark[pid] = d.mark[pid] === s ? '' : s;
      var pair = b.parentNode.children;
      pair[0].className = d.mark[pid] === 'PRESENT' ? 'onP' : '';
      pair[1].className = d.mark[pid] === 'ABSENT' ? 'onA' : '';
      paint();
    };
  });
  if ($('allp')) $('allp').onclick = function () { d.touched = true; c.people.forEach(function (p) { if (!d.mark[p.id]) d.mark[p.id] = 'PRESENT'; }); drawAttendance(a, d); };
  bindAddPerson(a, d, function (pid) { d.touched = true; d.mark[pid] = 'PRESENT'; drawAttendance(a, d); });
  if (!ro && !peopleCached()) loadPeople(a).catch(function () {});
  UNSAVED = function () { return !!d.touched; };
  if ($('save')) $('save').onclick = function () {
    var items = Object.keys(d.mark).filter(function (k) { return d.mark[k]; }).map(function (k) { return { pid: k, st: d.mark[k] }; });
    if (!items.length) return;
    $('save').disabled = true; busy(true);
    var payload = { clientId: d.cid, activityId: a.id, items: items };
    saveOrQueue('apiSaveAttendance', payload, 'Presenças · ' + c.act.title, function (r, queued) {
      busy(false); delete DR['att|' + a.id]; cxDel('att|' + a.id); cxDel('det|' + a.id); delete ST[a.id];
      var msg = queued ? 'Sem ligação: guardado no telefone, será enviado.' : (r.duplicate ? 'Já estava guardado.' : 'Presenças guardadas: ' + r.present + ' presentes, ' + r.absent + ' ausentes.');
      swapTop(function () { screenDone(a, 'ATTENDANCE', 'Presenças', msg, !!queued); });
    }, function (e) { busy(false); $('save').disabled = false; toast(e.message); });
  };
  paint();
}

/* ---------------- QUESTIONÁRIO (formulário existente, pré-preenchido) ---------------- */

function screenEval(a) {
  loadingPage('Questionário', a.title);
  var me = here();
  callT(30000, 'apiEvalLink', S.token, a.id).then(function (r) {
    if (here() !== me) return;
    var labels = { ACT: 'código da actividade', DATE: 'data', TITLE: 'título', TRAINER: 'formador', AREA: 'área', TYPE: 'tipo de aula' };
    var pre = (r.prefilled || []).map(function (k) { return labels[k] || k; });
    page(bhead('Questionário', a.title) + '<div class="body">' + ctxBox(r.act) + '<div class="card evalbox"><div style="font-size:34px">⭐</div><h2>' + esc(r.title || 'Questionário de satisfação') + '</h2>' +
      '<div class="small muted">' + (r.trainer ? 'Peça aos formandos para responderem no fim da sessão. O questionário é anónimo.' : 'O questionário é anónimo e demora 2 minutos.') + '</div>' +
      (pre.length ? '<div class="small muted" style="margin-top:8px">Já preenchido: ' + esc(pre.join(', ')) + '.</div>' : '') +
      '<button class="btn" id="eo">Abrir questionário</button>' +
      (r.trainer ? '<button class="sbtn" id="ew">Partilhar por WhatsApp</button><button class="sbtn" id="ec">Copiar link</button>' : '') + '</div>' + nextHtml(a, 'EVALUATION') + '</div>');
    bindNext(a);
    $('eo').onclick = function () { openExt(r.url); };
    if ($('ew')) $('ew').onclick = function () { openExt('https://wa.me/?text=' + encodeURIComponent((r.act.title || '') + ' · ' + dmy(r.act.date) + '\nQuestionário de satisfação (anónimo): ' + r.url)); };
    if ($('ec')) $('ec').onclick = function () {
      try { navigator.clipboard.writeText(r.url).then(function () { toast('Link copiado.'); }, function () { prompt(I18N.tr('Copie o link:'), r.url); }); } catch (e) { prompt(I18N.tr('Copie o link:'), r.url); }
    };
  }).catch(function (e) { if (here() === me) errorPage('Questionário', a.title, e.message, function () { screenEval(a); }); });
}


/* ============================================================
   v0.9 · NAVEGAÇÃO
   - Início (⌂) em todos os ecrãs; «Voltar» do telefone coerente
   - Ficha: anterior / seguinte (botões, deslizar o dedo, ← → no teclado)
   - Depois de guardar: ecrã de conclusão com o passo seguinte
   - Ao voltar de Learning & Assessment: reabre a ficha de onde saiu
   - Teclado (computador): Esc = voltar · Home = Início · ← → = anterior / seguinte
   ============================================================ */

/* sequência para anterior / seguinte: as minhas actividades se a ficha é minha, senão a agenda visível */
function pnList(a) {
  if (!ALL) return [];
  var mine = !!a.role;
  return ALL.acts.filter(function (x) { return (x.id === a.id) || (!x.hidden && (!mine || x.role)); })
    .sort(function (x, y) { return (x.date + (x.start || '99') + x.id).localeCompare(y.date + (y.start || '99') + y.id); });
}
function pnOf(a) {
  var l = pnList(a), i = -1;
  for (var k = 0; k < l.length; k++) if (l[k].id === a.id) { i = k; break; }
  return { prev: i > 0 ? l[i - 1] : null, next: i >= 0 && i < l.length - 1 ? l[i + 1] : null, mine: !!a.role };
}
function pnHtml(a) {
  var p = pnOf(a);
  var lab = function (x) { return x ? esc(fmtDate(x.date, false) + (x.noTime ? '' : ' · ' + x.start) + ' · ' + x.title) : '—'; };
  return '<div class="pn"><button id="pnP"' + (p.prev ? '' : ' disabled') + '><b>‹ Anterior</b><small>' + lab(p.prev) + '</small></button>' +
    '<button class="nx" id="pnN"' + (p.next ? '' : ' disabled') + '><b>Seguinte ›</b><small>' + lab(p.next) + '</small></button></div>' +
    '<div class="small muted" style="text-align:center">' + (p.mine ? 'Entre as suas actividades' : 'Entre as actividades da agenda') + '</div>' +
    '<div class="kbd">Teclado: ← → anterior / seguinte · Esc voltar · Home início</div>';
}
function pnGo(a, dir) {
  var p = pnOf(a), x = dir < 0 ? p.prev : p.next;
  if (!x) return;
  swapTop(function () { renderDetail(x); });
}
function bindPn(a) {
  if ($('pnP')) $('pnP').onclick = function () { pnGo(a, -1); };
  if ($('pnN')) $('pnN').onclick = function () { pnGo(a, 1); };
  var pg = $('pg'); if (!pg) return;
  pg.dataset.act = a.id;
  var x0 = null, y0 = 0;
  pg.addEventListener('touchstart', function (e) { var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; if (e.target.closest && e.target.closest('input,textarea,select,.wcrow')) x0 = null; }, { passive: true });
  pg.addEventListener('touchend', function (e) {
    if (x0 == null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 80 && Math.abs(dy) < 45) pnGo(a, dx < 0 ? 1 : -1);
  }, { passive: true });
}

/* passos seguintes de uma actividade (as outras acções, actividade seguinte com acções, Início) */
function nextActs(a, doneK) {
  var ax = ACT_ORDER.filter(function (k) { return k !== doneK && (a.ax || []).indexOf(k) >= 0; });
  return a.date > (ALL ? ALL.today : todayYmd()) ? [] : ax;
}
function nextTodo(a) {
  if (!ALL) return null;
  var today = ALL.today;
  return ALL.acts.filter(function (x) { return x.id !== a.id && !x.hidden && (x.ax || []).length && x.date === today; })
    .sort(function (x, y) { return (x.start || '99').localeCompare(y.start || '99'); })[0] || null;
}
function nextHtml(a, doneK) {
  var ax = nextActs(a, doneK), nx = nextTodo(a), h = '<div class="nextsec">';
  if (ax.length) h += '<div class="sec">Passo seguinte nesta actividade</div><div class="acts">' + ax.map(function (k) {
    var L = ACT_LABEL[k];
    return '<button class="abtn" data-nk="' + k + '"><span class="ic">' + L[0] + '</span><span><b>' + L[1] + '</b><small>' + L[2] + '</small></span><span class="go">›</span></button>';
  }).join('') + '</div>';
  if (nx) h += '<div class="sec">Outra actividade de hoje com registos</div>' + hrow(nx, ALL.today);
  h += '<div class="navrow"><button class="sbtn" id="nbAct">‹ Voltar à actividade</button><button class="sbtn" id="nbHome">⌂ Início</button></div></div>';
  return h;
}
function bindNext(a) {
  Array.prototype.forEach.call(document.querySelectorAll('#pg [data-nk]'), function (b) { b.onclick = function () { runAction(b.dataset.nk, a); }; });
  Array.prototype.forEach.call(document.querySelectorAll('#pg .nextsec .hrow'), function (b) { b.onclick = function () { openAct(findAct(b.dataset.id)); }; });
  if ($('nbAct')) $('nbAct').onclick = back;
  if ($('nbHome')) $('nbHome').onclick = goMenu;
}
function screenDone(a, k, title, msg, queued) {
  page(bhead(title, a.title) + '<div class="body"><div class="card done"><div class="ok">' + (queued ? '📤' : '✅') + '</div><h2>' + esc(msg) + '</h2>' +
    '<div class="small muted">' + esc(a.title) + ' · ' + esc(dmy(a.date)) + '</div></div>' + nextHtml(a, k) + '</div>');
  bindNext(a);
}

/* sair para Learning & Assessment (app instalada): lembra a ficha, para o «Voltar» regressar a ela */
var _laOpen09 = laOpen;
laOpen = function (mode, params) {
  try { var id = $('pg') && $('pg').dataset.act; if (IS_PWA) sessionStorage.setItem('ap_resume', JSON.stringify({ id: id || (params && params.activityId) || '', t: Date.now() })); } catch (e) {}
  _laOpen09(mode, params);
};
function resumeFromLa() {
  var r = null;
  try { r = JSON.parse(sessionStorage.getItem('ap_resume') || 'null'); sessionStorage.removeItem('ap_resume'); } catch (e) { r = null; }
  if (!r || !r.id || Date.now() - r.t > 3 * 3600000) return;
  var nav = null; try { nav = performance.getEntriesByType('navigation')[0]; } catch (e) {}
  if (!nav || nav.type !== 'back_forward') return;
  var a = findAct(r.id); if (a) openAct(a);
}
/* página restaurada da memória do navegador (bfcache): está tudo como estava */
window.addEventListener('pageshow', function (e) { if (e.persisted) { try { sessionStorage.removeItem('ap_resume'); } catch (x) {} } });

/* teclado (computador) */
document.addEventListener('keydown', function (e) {
  var t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (!S.token || !ALL) return;
  if (e.key === 'Escape' && $('pg')) { e.preventDefault(); back(); }
  else if (e.key === 'Home') { e.preventDefault(); goMenu(); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && $('pg') && $('pg').dataset.act && $('pnP')) {
    var a = findAct($('pg').dataset.act); if (a) { e.preventDefault(); pnGo(a, e.key === 'ArrowLeft' ? -1 : 1); }
  }
});

boot();
</script>
